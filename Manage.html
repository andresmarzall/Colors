<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestor de Inventario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .table-actions {
      width: 50px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="#">InventarioApp</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
      <div id="userArea" class="d-flex align-items-center"></div>
    </div>
  </nav>

  <div class="container mt-4" id="mainContent" style="display:none;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Gestión de Inventario</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" onclick="abrirNuevoProducto()">Nuevo Producto</button>
    </div>

    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Cantidad</th>
          <th>Precio</th>
          <th class="table-actions">Acciones</th>
        </tr>
      </thead>
      <tbody id="productosList"></tbody>
    </table>
  </div>

  <!-- Modal: Crear/Editar Producto -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="productForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="productModalLabel">Nuevo Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="productId" />
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" required />
          </div>
          <div class="mb-3">
            <label for="cantidad" class="form-label">Cantidad</label>
            <input type="number" class="form-control" id="cantidad" required />
          </div>
          <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" class="form-control" id="precio" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Confirmar Eliminación -->
  <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmar Eliminación</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          ¿Estás seguro de que deseas eliminar este producto?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase y lógica -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-analytics.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
      authDomain: "llamapp-c8d6c.firebaseapp.com",
      databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
      projectId: "llamapp-c8d6c",
      storageBucket: "llamapp-c8d6c.appspot.com",
      messagingSenderId: "132119278171",
      appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
      measurementId: "G-4VN80ZMS5L"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth();
    const db = getDatabase();
    const provider = new GoogleAuthProvider();

    const userArea = document.getElementById("userArea");
    const mainContent = document.getElementById("mainContent");
    const productosList = document.getElementById("productosList");
    let currentUser = null;
    let productoAEliminar = null;

    // Login y logout
    function login() {
      signInWithPopup(auth, provider).catch(console.error);
    }

    function logout() {
      signOut(auth).catch(console.error);
    }

    window.logout = logout;

    onAuthStateChanged(auth, (user) => {
      userArea.innerHTML = "";
      if (user) {
        currentUser = user;
        userArea.innerHTML = `
          <span class="text-white me-3">${user.displayName}</span>
          <button class="btn btn-outline-light btn-sm" onclick="logout()">Cerrar sesión</button>
        `;
        mainContent.style.display = "block";
        cargarProductos();
      } else {
        currentUser = null;
        mainContent.style.display = "none";
        userArea.innerHTML = `<button class="btn btn-outline-light btn-sm" onclick="login()">Iniciar sesión con Google</button>`;
      }
    });

    // Formulario y modales
    const form = document.getElementById("productForm");
    const productId = document.getElementById("productId");
    const nombre = document.getElementById("nombre");
    const cantidad = document.getElementById("cantidad");
    const precio = document.getElementById("precio");
    const productModal = new bootstrap.Modal(document.getElementById("productModal"));
    const confirmDeleteModal = new bootstrap.Modal(document.getElementById("confirmDeleteModal"));
    const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const producto = {
        nombre: nombre.value,
        cantidad: Number(cantidad.value),
        precio: Number(precio.value),
      };

      const userRef = `inventario/${currentUser.uid}/productos`;

      if (productId.value) {
        update(ref(db, `${userRef}/${productId.value}`), producto);
      } else {
        const newRef = push(ref(db, userRef));
        set(newRef, producto);
      }

      form.reset();
      productId.value = "";
      productModal.hide();
    });

    function cargarProductos() {
      const userRef = `inventario/${currentUser.uid}/productos`;
      const productosRef = ref(db, userRef);

      onValue(productosRef, (snapshot) => {
        productosList.innerHTML = "";
        snapshot.forEach((child) => {
          const data = child.val();
          const key = child.key;
          productosList.innerHTML += `
            <tr>
              <td>${data.nombre}</td>
              <td>${data.cantidad}</td>
              <td>$${data.precio.toFixed(2)}</td>
              <td class="text-center">
                <div class="dropdown">
                  <button class="btn btn-sm btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    ⚙️
                  </button>
                  <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#" onclick="editarProducto('${key}', '${data.nombre}', ${data.cantidad}, ${data.precio})">Editar</a></li>
                    <li><a class="dropdown-item text-danger" href="#" onclick="prepararEliminar('${key}')">Eliminar</a></li>
                  </ul>
                </div>
              </td>
            </tr>
          `;
        });
      });
    }

    // Crear nuevo
    window.abrirNuevoProducto = () => {
      form.reset();
      productId.value = "";
      document.getElementById("productModalLabel").textContent = "Nuevo Producto";
    };

    // Editar
    window.editarProducto = (id, nombreVal, cantidadVal, precioVal) => {
      productId.value = id;
      nombre.value = nombreVal;
      cantidad.value = cantidadVal;
      precio.value = precioVal;
      document.getElementById("productModalLabel").textContent = "Editar Producto";
      productModal.show();
    };

    // Eliminar
    window.prepararEliminar = (id) => {
      productoAEliminar = id;
      confirmDeleteModal.show();
    };

    confirmDeleteBtn.addEventListener("click", () => {
      const userRef = `inventario/${currentUser.uid}/productos/${productoAEliminar}`;
      remove(ref(db, userRef)).then(() => {
        confirmDeleteModal.hide();
        productoAEliminar = null;
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
