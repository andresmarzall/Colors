<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe Online</title>
  <style>
    body { font-family: Arial; text-align: center; background: #f5f5f5; }
    #board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; justify-content: center; margin-top: 20px; }
    .cell {
      width: 100px; height: 100px; background: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 2em; cursor: pointer; border: 1px solid #ccc;
    }
    #status { margin-top: 20px; font-weight: bold; }
    button { margin: 10px; padding: 10px 20px; font-size: 1em; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe Online</h1>
  <div id="auth">
    <button id="login">Iniciar sesión con Google</button>
    <button id="logout" style="display:none;">Cerrar sesión</button>
    <p id="user"></p>
  </div>
  <button id="playBtn" disabled>Jugar ahora</button>
  <div id="status">Inicia sesión para comenzar</div>
  <div id="board" style="display:none;"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove, update } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
      authDomain: "llamapp-c8d6c.firebaseapp.com",
      databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
      projectId: "llamapp-c8d6c",
      storageBucket: "llamapp-c8d6c.appspot.com",
      messagingSenderId: "132119278171",
      appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
      measurementId: "G-4VN80ZMS5L"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth();
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById("login");
    const logoutBtn = document.getElementById("logout");
    const userP = document.getElementById("user");
    const playBtn = document.getElementById("playBtn");
    const status = document.getElementById("status");
    const boardDiv = document.getElementById("board");

    let currentUser = null;
    let gameRef = null;
    let playerSymbol = null;
    let gameKey = null;

    loginBtn.onclick = () => signInWithPopup(auth, provider);
    logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userP.textContent = `Hola, ${user.displayName}`;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        playBtn.disabled = false;
        status.textContent = "Presiona 'Jugar ahora' para buscar partida";
      } else {
        currentUser = null;
        userP.textContent = "";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        playBtn.disabled = true;
        status.textContent = "Inicia sesión para comenzar";
      }
    });

    playBtn.onclick = async () => {
      status.textContent = "Buscando partida...";
      const queueRef = ref(db, "games");

      onValue(queueRef, async (snapshot) => {
        if (gameRef) return; // Ya unido

        const games = snapshot.val();
        let joined = false;

        if (games) {
          for (const key in games) {
            const game = games[key];
            if (game.playerO === "") {
              gameRef = ref(db, "games/" + key);
              gameKey = key;
              playerSymbol = "O";
              await update(gameRef, { playerO: currentUser.uid });
              joined = true;
              break;
            }
          }
        }

        if (!joined) {
          // Crear nueva sala
          const newGame = {
            playerX: currentUser.uid,
            playerO: "",
            board: Array(9).fill(""),
            turn: "X",
            winner: ""
          };
          const newRef = push(queueRef, newGame);
          gameRef = newRef;
          gameKey = newRef.key;
          playerSymbol = "X";
        }

        initGameListener();
        playBtn.style.display = "none";
        boardDiv.style.display = "grid";
        status.textContent = "Esperando rival...";
      }, { onlyOnce: true });
    };

    function initGameListener() {
      onValue(gameRef, (snapshot) => {
        const game = snapshot.val();
        if (!game) return;

        // Mostrar turno y estado
        if (game.playerO !== "" && game.playerX !== "") {
          status.textContent = game.winner
            ? (game.winner === "E" ? "Empate" : `Ganó ${game.winner}`)
            : (game.turn === playerSymbol ? "Tu turno" : "Turno rival");
          drawBoard(game.board, game.turn, game.winner);
        } else {
          status.textContent = "Esperando rival...";
        }
      });
    }

    function drawBoard(board, turn, winner) {
      boardDiv.innerHTML = "";
      board.forEach((cell, idx) => {
        const div = document.createElement("div");
        div.className = "cell";
        div.textContent = cell;
        if (!cell && turn === playerSymbol && !winner) {
          div.onclick = () => makeMove(idx, board);
        }
        boardDiv.appendChild(div);
      });
    }

    async function makeMove(index, board) {
      if (!gameRef) return;
      if (board[index] !== "") return;

      board[index] = playerSymbol;
      const winner = checkWinner(board);
      const nextTurn = playerSymbol === "X" ? "O" : "X";
      await update(gameRef, {
        board: board,
        turn: nextTurn,
        winner: winner
      });
    }

    function checkWinner(b) {
      const winPatterns = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];
      for (const [a,b1,c] of winPatterns) {
        if (b[a] && b[a] === b[b1] && b[a] === b[c]) return b[a];
      }
      return b.includes("") ? "" : "E"; // "E" de Empate
    }
  </script>
</body>
</html>
