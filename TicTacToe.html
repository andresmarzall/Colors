<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe Firebase</title>
  <style>
    body { font-family: sans-serif; margin:0; padding:0; background:#f8f9fa;}
    nav { background:#343a40; color:#fff; padding:1rem; display:flex; justify-content:space-between; align-items:center;}
    #board { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; max-width:260px; margin:auto; margin-top:20px;}
    .cell { background:#fff; border:1px solid #ccc; font-size:2rem; display:flex; align-items:center; justify-content:center; height:80px; cursor:pointer;}
    .cell:hover { background:#e9ecef; }
    .x { color:#0d6efd; } .o { color:#dc3545; }
    #status, #players { text-align:center; margin-top:1rem; }
    #btnPlay { display:block; margin:2rem auto; padding:0.7rem 1.5rem; font-size:1rem; }
    button { cursor:pointer; }
    @media(max-width:500px){ .cell {height:60px;} }
  </style>
</head>
<body>
  <nav>
    <div><strong>Tic Tac Toe 🔥</strong></div>
    <div id="userArea">
      <button id="btnLogin">Iniciar sesión</button>
    </div>
  </nav>
  <main style="padding:1rem">
    <button id="btnPlay" disabled>Jugar ahora</button>
    <div id="status"></div>
    <div id="players"><span id="p1">X: -</span> | <span id="p2">O: -</span></div>
    <div id="board"></div>
  </main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-analytics-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
      authDomain: "llamapp-c8d6c.firebaseapp.com",
      databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
      projectId: "llamapp-c8d6c",
      storageBucket: "llamapp-c8d6c.firebasestorage.app",
      messagingSenderId: "132119278171",
      appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
      measurementId: "G-4VN80ZMS5L"
    };
    firebase.initializeApp(firebaseConfig);
    firebase.analytics();

    const auth = firebase.auth();
    const db = firebase.database();

    const userArea = document.getElementById("userArea");
    const btnPlay = document.getElementById("btnPlay");
    const status = document.getElementById("status");
    const p1 = document.getElementById("p1");
    const p2 = document.getElementById("p2");
    const board = document.getElementById("board");

    let uid = null, name = "", roomId = null, symbol = null;

    function renderUser(user) {
      if (user) {
        uid = user.uid;
        name = user.displayName || "Jugador";
        userArea.innerHTML = `${name} <button id="btnLogout">Salir</button>`;
        document.getElementById("btnLogout").onclick = () => auth.signOut();
        btnPlay.disabled = false;
      } else {
        uid = null;
        name = "";
        roomId = null;
        symbol = null;
        userArea.innerHTML = `<button id="btnLogin">Iniciar sesión</button>`;
        document.getElementById("btnLogin").onclick = login;
        btnPlay.disabled = true;
        status.textContent = "";
        board.innerHTML = "";
        p1.textContent = "X: -";
        p2.textContent = "O: -";
      }
    }

    function login() {
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(console.error);
    }

    auth.onAuthStateChanged(user => renderUser(user));

    btnPlay.onclick = async () => {
      if (!uid) return;
      status.textContent = "Buscando partida...";
      btnPlay.disabled = true;
      const rooms = (await db.ref("rooms").once("value")).val() || {};
      for (const key in rooms) {
        if (!rooms[key].player2) {
          roomId = key;
          symbol = "O";
          await db.ref("rooms/" + key).update({ player2: { uid, name }, turn: "X" });
          listenRoom();
          return;
        }
      }
      const ref = db.ref("rooms").push();
      roomId = ref.key;
      symbol = "X";
      await ref.set({
        player1: { uid, name },
        board: Array(9).fill(""),
        turn: null,
        winner: null
      });
      listenRoom();
    };

    function listenRoom() {
      db.ref("rooms/" + roomId).on("value", snap => {
        const data = snap.val();
        if (!data) return status.textContent = "Sala eliminada";
        if (!data.player2) {
          status.textContent = "Esperando rival...";
          return;
        }
        p1.textContent = `X: ${data.player1.name}`;
        p2.textContent = `O: ${data.player2.name}`;
        status.textContent = data.winner ?
          (data.winner === "T" ? "Empate 🤝" :
           data.winner === symbol ? "¡Ganaste! 🏆" : "Perdiste 😢")
          : `Turno de ${data.turn === symbol ? "tú" : "rival"} (${data.turn})`;
        drawBoard(data.board, data.turn, data.winner);
      });
    }

    function drawBoard(b, turn, winner) {
      board.innerHTML = "";
      b.forEach((v, i) => {
        const cell = document.createElement("div");
        cell.className = "cell" + (v === "X" ? " x" : v === "O" ? " o" : "");
        cell.textContent = v;
        if (!v && turn === symbol && !winner) {
          cell.onclick = () => makeMove(i);
        }
        board.appendChild(cell);
      });
    }

    async function makeMove(i) {
      const ref = db.ref("rooms/" + roomId);
      const snap = await ref.get();
      const r = snap.val();
      if (r.board[i] || r.turn !== symbol || r.winner) return;
      r.board[i] = symbol;
      const winner = checkWinner(r.board);
      await ref.update({
        board: r.board,
        turn: winner ? r.turn : (r.turn === "X" ? "O" : "X"),
        winner: winner
      });
    }

    function checkWinner(b) {
      const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for (const [a,b1,c] of w) if (b[a] && b[a] === b[b1] && b[a] === b[c]) return b[a];
      return b.includes("") ? null : "T";
    }
  </script>
</body></html>
