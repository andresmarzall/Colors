<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe Real 🔥</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:1rem; text-align:center; background:#f5f5f5; }
    nav { margin-bottom:1rem; }
    button { padding:0.6rem 1.2rem; font-size:1rem; margin:0.3rem; cursor:pointer; }
    iframe { width:100%; max-width:400px; height:450px; border:none; margin-top:1rem; }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-analytics-compat.js"></script>
</head>
<body>
  <nav>
    <button id="login">Iniciar sesión (Google)</button>
    <button id="logout" style="display:none;">Cerrar sesión</button>
    <span id="user" style="margin-left:1rem;"></span>
  </nav>

  <button id="startGame" disabled>Jugar vs otro jugador</button>
  <div id="status" style="margin-top:1rem;"></div>
  <div id="gameContainer"></div>

  <script>
    // ✅ Tu configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
      authDomain: "llamapp-c8d6c.firebaseapp.com",
      databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
      projectId: "llamapp-c8d6c",
      storageBucket: "llamapp-c8d6c.appspot.com",
      messagingSenderId: "132119278171",
      appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
      measurementId: "G-4VN80ZMS5L"
    };

    firebase.initializeApp(firebaseConfig);
    firebase.analytics();
    const auth = firebase.auth();

    const loginBtn = document.getElementById('login');
    const logoutBtn = document.getElementById('logout');
    const userSpan = document.getElementById('user');
    const startBtn = document.getElementById('startGame');
    const statusDiv = document.getElementById('status');
    const gameContainer = document.getElementById('gameContainer');

    // ⚠️ Reemplaza esto con tu API Key real de PaperGames
    const apiKey = "TU_PAPERGAMES_API_KEY";

    loginBtn.onclick = () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider);
    };

    logoutBtn.onclick = () => {
      auth.signOut();
    };

    auth.onAuthStateChanged(user => {
      if (user) {
        userSpan.innerText = `Bienvenido, ${user.displayName}`;
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
        startBtn.disabled = false;
      } else {
        userSpan.innerText = '';
        loginBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        startBtn.disabled = true;
        gameContainer.innerHTML = '';
        statusDiv.innerText = '';
      }
    });

    startBtn.onclick = async () => {
      statusDiv.innerText = 'Creando partida…';
      gameContainer.innerHTML = '';
      try {
        const response = await fetch('https://api.papergames.io/api/v2/game-session/player-vs-player', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Api-Key': apiKey
          },
          body: JSON.stringify({
            gameType: "TicTacToe",
            language: "es",
            inactivityTimeout: 30,
            timerTimeout: 120
          })
        });

        if (!response.ok) throw new Error("Error al crear la partida");

        const data = await response.json();
        const user = firebase.auth().currentUser;
        const playUrl = data.playUrl + `?username=${encodeURIComponent(user.displayName)}`;

        statusDiv.innerText = 'Partida lista, esperando rival…';
        gameContainer.innerHTML = `<iframe src="${playUrl}" allowfullscreen></iframe>`;
      } catch (err) {
        console.error(err);
        statusDiv.innerText = 'Ocurrió un error al crear la partida.';
      }
    };
  </script>
</body>
</html>
