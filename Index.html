<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat App - Firebase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root {
      --primary-color: #4e73df;
      --secondary-color: #f8f9fc;
      --online-color: #1cc88a;
      --offline-color: #e74a3b;
    }
    
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
    }
    
    .status-badge {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      right: 0;
      border: 2px solid white;
    }
    
    .online {
      background-color: var(--online-color);
    }
    
    .offline {
      background-color: var(--offline-color);
    }
    
    .message-container {
      max-width: 70%;
      word-wrap: break-word;
    }
    
    .incoming-message {
      background-color: white;
      border-radius: 18px 18px 18px 4px;
    }
    
    .outgoing-message {
      background-color: var(--primary-color);
      color: white;
      border-radius: 18px 18px 4px 18px;
    }
    
    .message-time {
      font-size: 0.75rem;
      opacity: 0.7;
    }
    
    .chat-header {
      background-color: var(--primary-color);
      color: white;
    }
    
    .user-item {
      transition: all 0.2s;
      cursor: pointer;
    }
    
    .user-item:hover {
      background-color: var(--secondary-color);
      transform: translateX(5px);
    }
    
    .unread-badge {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
    }
    
    #chatHistory {
      scrollbar-width: thin;
      scrollbar-color: var(--primary-color) #f1f1f1;
    }
    
    #chatHistory::-webkit-scrollbar {
      width: 6px;
    }
    
    #chatHistory::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    
    #chatHistory::-webkit-scrollbar-thumb {
      background-color: var(--primary-color);
      border-radius: 6px;
    }
    
    .typing-indicator {
      height: 20px;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }
    
    .typing-dot {
      width: 6px;
      height: 6px;
      background-color: #6c757d;
      border-radius: 50%;
      margin: 0 2px;
      animation: typingAnimation 1.4s infinite ease-in-out;
    }
    
    .typing-dot:nth-child(1) {
      animation-delay: 0s;
    }
    
    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    
    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    
    @keyframes typingAnimation {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div id="alertContainer"></div>

    <!-- Login View -->
    <div id="loginView" class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
          <div class="card-body text-center p-5">
            <div class="mb-4">
              <i class="bi bi-chat-square-text-fill text-primary" style="font-size: 3rem;"></i>
              <h2 class="mt-3 mb-1">Chat App</h2>
              <p class="text-muted">Conéctate y comienza a chatear</p>
            </div>
            <button id="btnLoginGoogle" class="btn btn-danger w-100 py-2">
              <i class="bi bi-google me-2"></i> Continuar con Google
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="d-none">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
          <h5 class="mb-0"><i class="bi bi-people-fill me-2 text-primary"></i>Usuarios conectados</h5>
          <div class="d-flex align-items-center">
            <div class="position-relative me-3">
              <img id="userAvatar" src="" class="user-avatar">
              <span id="userStatusBadge" class="status-badge online"></span>
            </div>
            <button id="btnLogout" class="btn btn-outline-danger btn-sm">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>
        </div>
        <div class="card-body p-0">
          <ul id="usersList" class="list-group list-group-flush"></ul>
        </div>
      </div>
    </div>
<!-- Chat Modal -->
    <div class="modal fade" id="chatModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header chat-header py-3">
            <div class="d-flex align-items-center">
              <div class="position-relative me-3">
                <img id="chatPartnerAvatar" src="" class="user-avatar">
                <span id="chatPartnerStatus" class="status-badge offline"></span>
              </div>
              <div>
                <h5 id="chatPartnerName" class="modal-title mb-0"></h5>
                <div id="typingStatus" class="typing-indicator" style="display: none;">
                  <span class="typing-dot"></span>
                  <span class="typing-dot"></span>
                  <span class="typing-dot"></span>
                </div>
              </div>
            </div>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-0">
            <div id="chatHistory" class="p-3" style="height: 400px; overflow-y: auto;"></div>
          </div>
          <div class="modal-footer">
            <form id="chatForm" class="w-100">
              <div class="input-group">
                <input id="chatInput" class="form-control border-0 py-2" 
                       placeholder="Escribe un mensaje..." autocomplete="off" />
                <button class="btn btn-primary" type="submit">
                  <i class="bi bi-send-fill"></i>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK + Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, onDisconnect, remove, update, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
      authDomain: "llamapp-c8d6c.firebaseapp.com",
      databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
      projectId: "llamapp-c8d6c",
      storageBucket: "llamapp-c8d6c.appspot.com",
      messagingSenderId: "132119278171",
      appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
      measurementId: "G-4VN80ZMS5L"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    // DOM Elements
    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const btnLoginGoogle = document.getElementById('btnLoginGoogle');
    const btnLogout = document.getElementById('btnLogout');
    const userAvatar = document.getElementById('userAvatar');
    const userStatusBadge = document.getElementById('userStatusBadge');
    const usersList = document.getElementById('usersList');
    const alertContainer = document.getElementById('alertContainer');

    const chatModal = new bootstrap.Modal(document.getElementById('chatModal'));
    const chatPartnerAvatar = document.getElementById('chatPartnerAvatar');
    const chatPartnerName = document.getElementById('chatPartnerName');
    const chatPartnerStatus = document.getElementById('chatPartnerStatus');
    const chatHistory = document.getElementById('chatHistory');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const typingStatus = document.getElementById('typingStatus');

    // App State
    let currentUser = null;
    let chatPartner = null;
    let chatRef = null;
    let typingRef = null;
    let partnerTypingRef = null;
    let usersRef = null;
    let typingTimeout = null;
    let unreadCounts = {};

    // Sound Notification
    function playNotificationSound() {
      const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3');
      audio.volume = 0.3;
      audio.play().catch(e => console.log("Error playing sound:", e));
    }

    // Show Alert
    function showAlert(message, type = 'danger') {
      const alert = document.createElement('div');
      alert.className = `alert alert-${type} alert-dismissible fade show`;
      alert.innerHTML = `
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      `;
      alertContainer.appendChild(alert);
      setTimeout(() => alert.remove(), 5000);
    }

    // Format Time
    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Update User Status
    async function updateUserStatus(status) {
      if (!currentUser) return;
      
      const userRef = ref(db, 'users/' + currentUser.uid);
      await update(userRef, {
        status: status,
        lastSeen: status === 'online' ? null : Date.now()
      });
      
      userStatusBadge.className = `status-badge ${status === 'online' ? 'online' : 'offline'}`;
      
      if (status === 'offline') {
        onDisconnect(userRef).update({
          status: 'offline',
          lastSeen: Date.now()
        });
      }
    }

    // Load Users List
    function loadUsers() {
      if (usersRef) off(usersRef);
      
      usersRef = ref(db, 'users');
      onValue(usersRef, snap => {
        usersList.innerHTML = '';
        unreadCounts = {};
        
        if (!snap.exists()) return;
        
        const users = [];
        snap.forEach(userSnap => {
          const user = userSnap.val();
          if (user.uid === currentUser.uid) return;
          users.push(user);
        });
 // Sort users: online first, then by last activity
        users.sort((a, b) => {
          if (a.status === 'online' && b.status !== 'online') return -1;
          if (a.status !== 'online' && b.status === 'online') return 1;
          return (b.lastSeen || 0) - (a.lastSeen || 0);
        });
        
        // Display users
        users.forEach(user => {
          const li = document.createElement('li');
          li.className = 'list-group-item user-item d-flex align-items-center position-relative';
          
          // Check for unread messages
          const unread = user.unread && user.unread[currentUser.uid] ? user.unread[currentUser.uid].count : 0;
          unreadCounts[user.uid] = unread;
          
          li.innerHTML = `
            <div class="position-relative me-3">
              <img src="${user.photo || 'https://via.placeholder.com/40'}" class="user-avatar">
              <span class="status-badge ${user.status === 'online' ? 'online' : 'offline'}"></span>
            </div>
            <div class="flex-grow-1">
              <div class="d-flex justify-content-between align-items-center">
                <strong>${user.name}</strong>
                <small class="text-muted">${user.status === 'online' ? 'En línea' : 'Desconectado'}</small>
              </div>
            </div>
            ${unread > 0 ? `<span class="unread-badge badge bg-primary rounded-pill">${unread}</span>` : ''}
          `;
          
          li.addEventListener('click', () => openChat(user.uid, user));
          usersList.appendChild(li);
        });
      });
    }

    // Open Chat with a User
    function openChat(partnerUid, partnerData) {
      chatPartner = partnerUid;
      chatPartnerName.textContent = partnerData.name;
      chatPartnerAvatar.src = partnerData.photo || 'https://via.placeholder.com/40';
      chatPartnerStatus.className = `status-badge ${partnerData.status === 'online' ? 'online' : 'offline'}`;
      chatHistory.innerHTML = '';
      typingStatus.style.display = 'none';
      
      // Clear previous listeners
      if (chatRef) off(chatRef);
      if (partnerTypingRef) off(partnerTypingRef);
      
      // Create chat ID (sorted to ensure consistency)
      const chatId = [currentUser.uid, partnerUid].sort().join('_');
      
      // References
      chatRef = ref(db, 'chats/' + chatId);
      typingRef = ref(db, `typing/${chatId}/${currentUser.uid}`);
      partnerTypingRef = ref(db, `typing/${chatId}/${partnerUid}`);
      
      // Listen for messages
      onValue(chatRef, snap => {
        chatHistory.innerHTML = '';
        
        if (!snap.exists()) return;
        
        const messages = [];
        snap.forEach(msgSnap => {
          messages.push({
            id: msgSnap.key,
            ...msgSnap.val()
          });
        });
        
        // Sort messages by timestamp
        messages.sort((a, b) => a.createdAt - b.createdAt);
        
        // Display messages
        messages.forEach(msg => {
          const isOutgoing = msg.from === currentUser.uid;
          const messageDiv = document.createElement('div');
          messageDiv.className = `d-flex mb-3 ${isOutgoing ? 'justify-content-end' : 'justify-content-start'}`;
          
          messageDiv.innerHTML = `
            <div class="message-container">
              <div class="p-3 ${isOutgoing ? 'outgoing-message' : 'incoming-message'}">
                ${msg.text}
                <div class="message-time mt-1 text-end">${formatTime(msg.createdAt)}</div>
              </div>
            </div>
          `;
          
          chatHistory.appendChild(messageDiv);
          
          // Play sound for incoming messages when chat is not focused
          if (!isOutgoing && document.hidden) {
            playNotificationSound();
          }
        });
        
        // Scroll to bottom
        chatHistory.scrollTop = chatHistory.scrollHeight;
        
        // Mark messages as read
        if (messages.length > 0) {
          markMessagesAsRead(chatId, partnerUid);
        }
      });
      
      // Listen for typing indicator
      onValue(partnerTypingRef, snap => {
        typingStatus.style.display = snap.val() ? 'flex' : 'none';
      });
      
      // Show modal
      chatModal.show();
    }

    // Mark messages as read
    function markMessagesAsRead(chatId, partnerUid) {
      if (!unreadCounts[partnerUid]) return;
      
      // Update unread count
      const unreadRef = ref(db, `users/${partnerUid}/unread/${currentUser.uid}`);
      update(unreadRef, {
        count: 0,
        lastMessage: null,
        timestamp: null
      });
      
      // Update UI
      unreadCounts[partnerUid] = 0;
      document.querySelectorAll('.unread-badge').forEach(badge => {
        if (badge.textContent.includes(partnerUid)) {
          badge.remove();
        }
      });
    }
  // Event Listeners
    btnLoginGoogle.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        showAlert(`Error al iniciar sesión: ${error.message}`);
      }
    });

    btnLogout.addEventListener('click', async () => {
      try {
        await updateUserStatus('offline');
        await signOut(auth);
      } catch (error) {
        showAlert(`Error al cerrar sesión: ${error.message}`);
      }
    });

    chatInput.addEventListener('input', () => {
      if (!typingRef || !chatPartner) return;
      
      set(typingRef, true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => remove(typingRef), 1500);
    });

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const message = chatInput.value.trim();
      if (!message || !chatRef || !chatPartner) return;
      
      try {
        const chatId = [currentUser.uid, chatPartner].sort().join('_');
        
        // Push new message
        await push(chatRef, {
          from: currentUser.uid,
          to: chatPartner,
          text: message,
          createdAt: Date.now(),
          read: false
        });
        
        // Update unread count for recipient
        const unreadRef = ref(db, `users/${chatPartner}/unread/${currentUser.uid}`);
        update(unreadRef, {
          count: increment(1),
          lastMessage: message.length > 30 ? message.substring(0, 30) + '...' : message,
          timestamp: Date.now()
        });
        
        // Clear input and typing indicator
        chatInput.value = '';
        remove(typingRef);
        
      } catch (error) {
        showAlert(`Error al enviar mensaje: ${error.message}`);
      }
    });

    // Auth State Observer
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        loginView.classList.add('d-none');
        dashboardView.classList.remove('d-none');
        userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
        
        // Update user profile in database
        const userRef = ref(db, 'users/' + user.uid);
        await set(userRef, {
          uid: user.uid,
          name: user.displayName,
          email: user.email,
          photo: user.photoURL || 'https://via.placeholder.com/40',
          status: 'online'
        });
        
        // Setup presence
        await updateUserStatus('online');
        
        // Load users list
        loadUsers();
        
      } else {
        currentUser = null;
        loginView.classList.remove('d-none');
        dashboardView.classList.add('d-none');
      }
    });

    // Handle visibility changes
    document.addEventListener('visibilitychange', () => {
      if (!currentUser) return;
      
      if (document.hidden) {
        updateUserStatus('away');
      } else {
        updateUserStatus('online');
      }
    });

    // Close chat modal cleanup
    document.getElementById('chatModal').addEventListener('hidden.bs.modal', () => {
      if (chatRef) off(chatRef);
      if (partnerTypingRef) off(partnerTypingRef);
      if (typingRef) remove(typingRef);
      
      chatPartner = null;
      chatRef = null;
      typingRef = null;
      partnerTypingRef = null;
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
