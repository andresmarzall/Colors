<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arco y Flecha Retro</title>
  <style>
    body {
      margin: 0;
      background: #111;
      overflow: hidden;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      background: #4ab;
    }
    .controls {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 10px;
      box-sizing: border-box;
    }
    .joystick {
      position: relative;
      width: 100px;
      height: 100px;
      background: #333;
      border-radius: 50%;
    }
    .stick {
      position: absolute;
      width: 40px;
      height: 40px;
      background: #777;
      border-radius: 50%;
      top: 30px;
      left: 30px;
    }
    .button {
      width: 80px;
      height: 80px;
      background: #c33;
      border-radius: 50%;
      text-align: center;
      line-height: 80px;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="controls">
    <div class="joystick" id="joystick">
      <div class="stick" id="stick"></div>
    </div>
    <div class="button" id="shoot">FIRE</div>
  </div>  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    let width = window.innerWidth;
    let height = window.innerHeight * 0.7;
    canvas.width = width;
    canvas.height = height;

    // Base64 sounds
    const shootSound = new Audio("data:audio/wav;base64,UklGRtIzAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0Ya4zAAAAAP8//z//P/8//z//P/8//z//P/8//z//P/8//z//");
    const hitSound = new Audio("data:audio/wav;base64,UklGRkZWAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YSJWAAAAAP8//z//P/8//z//P/8//z//P/8//P/8//z//");

    // Player
    const player = { x: width / 2, y: height - 60 };
    const arrows = [];
    const targets = [];

    for (let i = 0; i < 5; i++) {
      targets.push({
        x: Math.random() * (width - 50),
        y: Math.random() * height / 2,
        dx: 2 + Math.random() * 2
      });
    }

    // Controls
    let dx = 0;
    document.getElementById("shoot").addEventListener("touchstart", () => {
      arrows.push({ x: player.x, y: player.y });
      shootSound.currentTime = 0;
      shootSound.play();
    });

    const joystick = document.getElementById("joystick");
    const stick = document.getElementById("stick");
    joystick.addEventListener("touchmove", e => {
      const touch = e.touches[0];
      const rect = joystick.getBoundingClientRect();
      const relX = touch.clientX - rect.left - 50;
      dx = relX / 20;
    });
    joystick.addEventListener("touchend", () => {
      dx = 0;
    });

    function draw() {
      ctx.clearRect(0, 0, width, height);
      // Player
      ctx.fillStyle = "black";
      ctx.fillRect(player.x - 10, player.y - 10, 20, 20);

      // Arrows
      ctx.fillStyle = "white";
      for (let a of arrows) {
        a.y -= 5;
        ctx.fillRect(a.x, a.y, 2, 10);
      }

      // Targets
      ctx.fillStyle = "red";
      for (let t of targets) {
        t.x += t.dx;
        if (t.x > width - 30 || t.x < 0) t.dx *= -1;
        ctx.fillRect(t.x, t.y, 30, 30);
      }

      // Collisions
      arrows.forEach((a, ai) => {
        targets.forEach((t, ti) => {
          if (a.x > t.x && a.x < t.x + 30 && a.y > t.y && a.y < t.y + 30) {
            arrows.splice(ai, 1);
            targets.splice(ti, 1);
            hitSound.currentTime = 0;
            hitSound.play();
          }
        });
      });
    }

    function update() {
      player.x += dx;
      if (player.x < 0) player.x = 0;
      if (player.x > width) player.x = width;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();

    window.addEventListener("resize", () => {
      width = window.innerWidth;
      height = window.innerHeight * 0.7;
      canvas.width = width;
      canvas.height = height;
    });
  </script></body>
</html>
