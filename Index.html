<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Simple</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .contact-item:hover { background-color: #f8f9fa; cursor: pointer; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div id="loginView">
            <div class="card shadow">
                <div class="card-body text-center p-5">
                    <h2 class="mb-4">Iniciar sesión</h2>
                    <button id="btnLoginGoogle" class="btn btn-danger">
                        <i class="bi bi-google"></i> Continuar con Google
                    </button>
                </div>
            </div>
        </div>

        <div id="dashboardView" class="d-none">
            <div class="card shadow">
                <div class="card-header bg-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Usuarios</h5>
                        <button id="btnLogout" class="btn btn-sm btn-outline-danger">Cerrar sesión</button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="usersList" class="list-group">
                        <!-- Los usuarios aparecerán aquí -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getDatabase, 
            ref, 
            onValue,
            set
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
            authDomain: "llamapp-c8d6c.firebaseapp.com",
            databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
            projectId: "llamapp-c8d6c",
            storageBucket: "llamapp-c8d6c.appspot.com",
            messagingSenderId: "132119278171",
            appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
            measurementId: "G-4VN80ZMS5L"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // Elementos del DOM
        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const btnLoginGoogle = document.getElementById('btnLoginGoogle');
        const btnLogout = document.getElementById('btnLogout');
        const usersList = document.getElementById('usersList');

        // Iniciar sesión con Google
        btnLoginGoogle.addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                console.log("Usuario autenticado:", result.user);
            } catch (error) {
                console.error("Error al iniciar sesión:", error);
            }
        });

        // Cerrar sesión
        btnLogout.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Error al cerrar sesión:", error);
            }
        });

        // Escuchar cambios de autenticación
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Usuario logueado
                loginView.classList.add('d-none');
                dashboardView.classList.remove('d-none');
                
                // Guardar usuario en la base de datos
                set(ref(db, 'users/' + user.uid), {
                    uid: user.uid,
                    displayName: user.displayName,
                    email: user.email,
                    photoURL: user.photoURL
                });
                
                // Cargar lista de usuarios
                loadUsers();
            } else {
                // Usuario no logueado
                loginView.classList.remove('d-none');
                dashboardView.classList.add('d-none');
            }
        });

        // Cargar usuarios registrados
        function loadUsers() {
            const usersRef = ref(db, 'users');
            
            onValue(usersRef, (snapshot) => {
                usersList.innerHTML = '';
                
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const user = childSnapshot.val();
                        
                        // No mostrar el usuario actual en la lista
                        if (user.uid === auth.currentUser?.uid) return;
                        
                        const userElement = document.createElement('div');
                        userElement.className = 'list-group-item contact-item';
                        userElement.innerHTML = `
                            <div class="d-flex align-items-center">
                                <img src="${user.photoURL || 'https://via.placeholder.com/40'}" 
                                     alt="${user.displayName}" class="user-avatar me-3">
                                <div>
                                    <h6 class="mb-0">${user.displayName || user.email}</h6>
                                    <small class="text-muted">${user.email}</small>
                                </div>
                            </div>
                        `;
                        
                        usersList.appendChild(userElement);
                    });
                } else {
                    usersList.innerHTML = '<div class="text-center py-3 text-muted">No hay usuarios registrados</div>';
                }
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
