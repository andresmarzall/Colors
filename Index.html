<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat en segundo plano</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .chat-message { white-space: pre-wrap; }
    .incoming { background: #f1f1f1; padding: 5px; border-radius: 4px; margin-bottom: 5px; }
    .outgoing { background: #d1e7dd; padding: 5px; border-radius: 4px; margin-bottom: 5px; text-align: right; }
    .typing-indicator { font-style: italic; font-size: 0.9em; color: #666; }
  </style>
</head>
<body class="bg-light">

<div class="container py-4">
  <div id="loginView" class="text-center">
    <h1 class="mb-4">Chat en segundo plano</h1>
    <button id="btnLoginGoogle" class="btn btn-danger">
      <i class="bi bi-google"></i> Iniciar sesión con Google
    </button>
  </div>

  <div id="dashboardView" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Usuarios registrados</h3>
      <div>
        <img id="currentUserAvatar" class="user-avatar me-2" src="">
        <button id="btnLogout" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
      </div>
    </div>
    <ul id="userList" class="list-group"></ul>
  </div>
</div>

<!-- Chat Modal -->
<div class="modal fade" id="chatModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="chatModalLabel" class="modal-title">Chat</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="chatMessages" class="mb-2" style="max-height: 300px; overflow-y: auto;"></div>
        <div id="typingIndicator" class="typing-indicator"></div>
        <form id="chatForm">
          <div class="input-group">
            <input type="text" id="chatInput" class="form-control" placeholder="Mensaje..." required autocomplete="off">
            <button class="btn btn-primary" type="submit"><i class="bi bi-send"></i></button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // Base64 “ding” short sound
  const dingSound = "data:audio/wav;base64,UklGRhQAAABXQVZFZm10IBIAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=";

  const firebaseConfig = {
    apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
    authDomain: "llamapp-c8d6c.firebaseapp.com",
    databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
    projectId: "llamapp-c8d6c",
    storageBucket: "llamapp-c8d6c.appspot.com",
    messagingSenderId: "132119278171",
    appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
    measurementId: "G-4VN80ZMS5L"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();

  const loginView = document.getElementById('loginView');
  const dashboardView = document.getElementById('dashboardView');
  const btnLoginGoogle = document.getElementById('btnLoginGoogle');
  const btnLogout = document.getElementById('btnLogout');
  const userList = document.getElementById('userList');
  const currentUserAvatar = document.getElementById('currentUserAvatar');
  const chatModal = new bootstrap.Modal(document.getElementById('chatModal'));
  const chatModalLabel = document.getElementById('chatModalLabel');
  const chatMessages = document.getElementById('chatMessages');
  const typingIndicator = document.getElementById('typingIndicator');
  const chatForm = document.getElementById('chatForm');
  const chatInput = document.getElementById('chatInput');

  let currentUser = null;
  let currentChatUser = null, chatId = null;

  btnLoginGoogle.onclick = () => signInWithPopup(auth, provider).catch(() => alert("Fallo login"));
  btnLogout.onclick = () => signOut(auth);

  onAuthStateChanged(auth, user => {
    if (user) {
      currentUser = user;
      loginView.classList.add('d-none');
      dashboardView.classList.remove('d-none');
      currentUserAvatar.src = user.photoURL;

      set(ref(db, `users/${user.uid}`), {
        name: user.displayName,
        email: user.email,
        photo: user.photoURL
      });

      loadUsers();
    } else {
      loginView.classList.remove('d-none');
      dashboardView.classList.add('d-none');
    }
  });

  function loadUsers() {
    onValue(ref(db, 'users'), snap => {
      userList.innerHTML = '';
      snap.forEach(child => {
        const u = child.val(), uid = child.key;
        if (uid === currentUser.uid) return;
        const li = document.createElement('li');
        li.className = "list-group-item list-group-item-action d-flex align-items-center";
        li.innerHTML = `<img src="${u.photo}" class="user-avatar me-2"><span>${u.name}</span>`;
        li.onclick = () => openChat(uid, u);
        userList.appendChild(li);
      });
    });
  }

  function openChat(uid, u) {
    currentChatUser = u;
    chatId = [currentUser.uid, uid].sort().join('_');
    chatModalLabel.textContent = `Chat con ${u.name}`;
    chatMessages.innerHTML = '';
    typingIndicator.textContent = '';
    chatModal.show();

    onValue(ref(db, `chats/${chatId}`), snap => {
      chatMessages.innerHTML = '';
      snap.forEach(child => {
        const m = child.val();
        const div = document.createElement('div');
        div.className = "chat-message " + (m.from === currentUser.uid ? 'outgoing' : 'incoming');
        div.textContent = m.text;
        chatMessages.appendChild(div);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    onValue(ref(db, `typing/${chatId}/${uid}`), snap => {
      typingIndicator.textContent = snap.val() ? `${u.name} está escribiendo...` : '';
    });

    // listener para notificación
    onValue(ref(db, `chats/${chatId}`), snap => {
      let last = null;
      snap.forEach(child => last = child.val());
      if (last && last.from !== currentUser.uid) {
        const notif = new Notification(`Mensaje de ${u.name}`, { body: last.text });
        const audio = new Audio(dingSound);
        audio.play();
      }
    });
  }

  chatInput.oninput = () => {
    if (!chatId) return;
    update(ref(db, `typing/${chatId}/${currentUser.uid}`), true);
    clearTimeout(window.__typingTimeout);
    window.__typingTimeout = setTimeout(() => {
      update(ref(db, `typing/${chatId}/${currentUser.uid}`), null);
    }, 1500);
  };

  chatForm.onsubmit = async e => {
    e.preventDefault();
    if (!chatId || !chatInput.value.trim()) return;
    const text = chatInput.value.trim();
    await push(ref(db, `chats/${chatId}`), {
      from: currentUser.uid,
      to: currentChatUser.uid,
      text,
      createdAt: Date.now()
    });
    chatInput.value = '';
    update(ref(db, `typing/${chatId}/${currentUser.uid}`), null);
  };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
