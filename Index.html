<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arco y Flecha</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: linear-gradient(to bottom, #87ceeb, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 20px;
    }

    canvas {
      background-color: #e0e0e0;
      border: 2px solid #333;
      border-radius: 10px;
      margin-top: 20px;
    }

    .scoreboard {
      margin-top: 10px;
      font-size: 1.2em;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      background-color: #333;
      color: white;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      canvas {
        width: 100% !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>
  <h1>🏹 Juego de Arco y Flecha</h1>
  <canvas id="gameCanvas" width="600" height="400"></canvas>
  <div class="scoreboard">
    🎯 Puntaje: <span id="score">0</span> | 🏆 Récord: <span id="highscore">0</span> | 🏹 Flechas: <span id="arrows">10</span>
  </div>
  <button onclick="restartGame()">Reiniciar</button>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let target = { x: 0, y: 100, width: 40, height: 40, speed: 2 };
    let arrows = [];
    let score = 0;
    let highscore = localStorage.getItem("highscore") || 0;
    let arrowsLeft = 10;
    let gameOver = false;

    document.getElementById("highscore").textContent = highscore;

    function drawTarget() {
      ctx.fillStyle = "red";
      ctx.beginPath();
      ctx.arc(target.x + target.width / 2, target.y + target.height / 2, target.width / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawArrows() {
      ctx.fillStyle = "black";
      arrows.forEach(arrow => {
        ctx.fillRect(arrow.x, arrow.y, 5, 20);
      });
    }

    function updateArrows() {
      arrows.forEach(arrow => {
        arrow.y -= 5;
      });

      arrows = arrows.filter(arrow => arrow.y > 0);

      arrows.forEach(arrow => {
        if (
          arrow.x > target.x &&
          arrow.x < target.x + target.width &&
          arrow.y > target.y &&
          arrow.y < target.y + target.height
        ) {
          score++;
          arrowsLeft++;
          arrowsLeft = Math.min(arrowsLeft, 10);
          arrows = arrows.filter(a => a !== arrow);
          target.speed += 0.3;
        }
      });
    }

    function drawBow() {
      ctx.fillStyle = "brown";
      ctx.fillRect(canvas.width / 2 - 5, canvas.height - 30, 10, 30);
    }

    function shootArrow(x) {
      if (gameOver) return;
      if (arrowsLeft > 0) {
        arrows.push({ x: x, y: canvas.height - 40 });
        arrowsLeft--;
      }
    }

    function updateTarget() {
      target.x += target.speed;
      if (target.x + target.width > canvas.width || target.x < 0) {
        target.speed *= -1;
      }
    }

    function update() {
      if (gameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      updateTarget();
      updateArrows();

      drawTarget();
      drawArrows();
      drawBow();

      document.getElementById("score").textContent = score;
      document.getElementById("arrows").textContent = arrowsLeft;

      if (arrowsLeft <= 0 && arrows.length === 0) {
        gameOver = true;
        if (score > highscore) {
          highscore = score;
          localStorage.setItem("highscore", highscore);
        }
        setTimeout(() => {
          alert("🎮 Juego terminado. Puntaje: " + score);
        }, 300);
      }

      requestAnimationFrame(update);
    }

    canvas.addEventListener("click", e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      shootArrow(x);
    });

    function restartGame() {
      score = 0;
      arrowsLeft = 10;
      arrows = [];
      target = { x: 0, y: 100, width: 40, height: 40, speed: 2 };
      gameOver = false;
      update();
    }

    update();
  </script>
</body>
</html>
