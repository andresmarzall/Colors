<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat y Llamada 1 a 1 - Firebase + WebRTC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div id="alertContainer"></div>

    <!-- Login View -->
    <div id="loginView" class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="card-body text-center p-5">
            <h2 class="mb-4">Chat App</h2>
            <p class="text-muted mb-4">Ingresa con Google</p>
            <button id="btnLoginGoogle" class="btn btn-danger btn-lg w-100">
              <i class="bi bi-google"></i> Continuar con Google
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-chat-dots"></i> Usuarios</h2>
        <div>
          <img id="userAvatar" src="" class="rounded-circle me-2" width="40" height="40">
          <button id="btnLogout" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
        </div>
      </div>
      <ul id="usersList" class="list-group mb-4"></ul>
    </div>

    <!-- Chat Modal -->
    <div class="modal fade" id="chatModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <h5 id="chatModalLabel" class="modal-title mb-0">Chat</h5>
              <small id="typingStatus" class="text-muted"></small>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="chatHistory" class="mb-3" style="max-height: 400px; overflow-y: auto;"></div>
            <form id="chatForm" class="d-flex">
              <input id="chatInput" class="form-control me-2" placeholder="Escribe un mensaje..." autocomplete="off" />
              <button class="btn btn-primary" type="submit">Enviar</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Call Modal -->
    <div class="modal fade" id="callModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content text-center p-4">
          <h5 id="callStatus">En llamada...</h5>
          <p id="callTimer">00:00</p>
          <button id="btnEndCall" class="btn btn-danger">Colgar</button>
        </div>
      </div>
    </div>

    <!-- Incoming Call Modal -->
    <div class="modal fade" id="incomingCallModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content text-center p-4">
          <h5 id="incomingCallLabel"></h5>
          <button id="btnAcceptCall" class="btn btn-success me-2">Aceptar</button>
          <button id="btnRejectCall" class="btn btn-secondary">Rechazar</button>
        </div>
      </div>
    </div>

    <!-- Audio elements -->
    <audio id="localAudio" autoplay muted></audio>
    <audio id="remoteAudio" autoplay></audio>

  </div>

  <!-- Firebase + WebRTC Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, onDisconnect, remove, update, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
      authDomain: "llamapp-c8d6c.firebaseapp.com",
      databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
      projectId: "llamapp-c8d6c",
      storageBucket: "llamapp-c8d6c.appspot.com",
      messagingSenderId: "132119278171",
      appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
      measurementId: "G-4VN80ZMS5L"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    // UI Elements
    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const btnLoginGoogle = document.getElementById('btnLoginGoogle');
    const btnLogout = document.getElementById('btnLogout');
    const userAvatar = document.getElementById('userAvatar');
    const usersList = document.getElementById('usersList');
    const alertContainer = document.getElementById('alertContainer');

    const chatModal = new bootstrap.Modal(document.getElementById('chatModal'));
    const chatModalLabel = document.getElementById('chatModalLabel');
    const chatHistory = document.getElementById('chatHistory');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const typingStatus = document.getElementById('typingStatus');

    const callModal = new bootstrap.Modal(document.getElementById('callModal'));
    const incomingCallModal = new bootstrap.Modal(document.getElementById('incomingCallModal'));
    const callStatus = document.getElementById('callStatus');
    const callTimer = document.getElementById('callTimer');
    const btnEndCall = document.getElementById('btnEndCall');
    const btnAcceptCall = document.getElementById('btnAcceptCall');
    const btnRejectCall = document.getElementById('btnRejectCall');
    const localAudio = document.getElementById('localAudio');
    const remoteAudio = document.getElementById('remoteAudio');

    let currentUser = null;
    let chatPartner = null;
    let chatRef = null;
    let typingRef = null;
    let partnerTypingRef = null;

    let callInterval;
    let peerConnection;
    let localStream;
    let currentCallId;
    const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    function notifySound() {
      const ctx = new AudioContext();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.05, ctx.currentTime);
      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start();
      oscillator.stop(ctx.currentTime + 0.15);
    }

    function showError(msg) {
      const alert = document.createElement('div');
      alert.className = 'alert alert-danger alert-dismissible fade show';
      alert.innerHTML = `${msg}<button class="btn-close" data-bs-dismiss="alert"></button>`;
      alertContainer.appendChild(alert);
      setTimeout(() => alert.remove(), 5000);
    }

    btnLoginGoogle.onclick = async () => {
      try { await signInWithPopup(auth, provider); }
      catch (e) { showError("Error de login: " + e.message); }
    };

    btnLogout.onclick = async () => {
      if (chatRef) off(chatRef);
      if (partnerTypingRef) off(partnerTypingRef);
      stopCall();
      await signOut(auth);
    };

    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user;
        loginView.classList.add('d-none');
        dashboardView.classList.remove('d-none');
        userAvatar.src = user.photoURL;

        const userRef = ref(db, 'presence/' + user.uid);
        set(userRef, { name: user.displayName, photo: user.photoURL });
        onDisconnect(userRef).remove();

        loadUsers();
        listenForCalls();
      } else {
        currentUser = null;
        loginView.classList.remove('d-none');
        dashboardView.classList.add('d-none');
      }
    });

    function loadUsers() {
      onValue(ref(db, 'presence'), snap => {
        usersList.innerHTML = '';
        snap.forEach(u => {
          const uid = u.key;
          if (uid === currentUser.uid) return;
          const data = u.val();
          const li = document.createElement('li');
          li.className = 'list-group-item d-flex justify-content-between align-items-center';
          li.innerHTML = `
            <div class="d-flex align-items-center">
              <img src="${data.photo}" class="rounded-circle me-3" width="30" height="30">
              <span>${data.name}</span>
            </div>
            <div>
              <button class="btn btn-outline-primary btn-sm me-2" onclick="openChat('${uid}','${data.name}')">Chat</button>
              <button class="btn btn-outline-success btn-sm" onclick="startCall('${uid}','${data.name}')">Llamar</button>
            </div>`;
          usersList.appendChild(li);
        });
      });
    }

    // Chat directo existente...
    window.openChat = function(partnerUid, partnerName) {
      chatPartner = partnerUid;
      chatModalLabel.textContent = "Chat con " + partnerName;
      chatHistory.innerHTML = '';
      typingStatus.textContent = '';

      if (chatRef) off(chatRef);
      if (partnerTypingRef) off(partnerTypingRef);

      const chatId = currentUser.uid < partnerUid
        ? currentUser.uid + '_' + partnerUid
        : partnerUid + '_' + currentUser.uid;

      chatRef = ref(db, 'chats/' + chatId);
      typingRef = ref(db, `typing/${chatId}/${currentUser.uid}`);
      partnerTypingRef = ref(db, `typing/${chatId}/${partnerUid}`);

      onValue(chatRef, snap => {
        chatHistory.innerHTML = '';
        snap.forEach(msg => {
          const m = msg.val();
          const div = document.createElement('div');
          div.className = m.from === currentUser.uid ? 'text-end mb-2' : 'text-start mb-2';
          div.innerHTML = `
            <span class="badge ${m.from === currentUser.uid ? 'bg-primary' : 'bg-secondary'}">${m.text}</span><br>
            <small class="text-muted">${new Date(m.createdAt).toLocaleTimeString()}</small>`;
          chatHistory.appendChild(div);
          if (m.from !== currentUser.uid) notifySound();
        });
        chatHistory.scrollTop = chatHistory.scrollHeight;
      });

      onValue(partnerTypingRef, snap => {
        typingStatus.textContent = snap.val() ? `${partnerName} está escribiendo...` : '';
      });

      chatModal.show();
    };

    let typingTimeout;
    chatInput.oninput = () => {
      if (!typingRef) return;
      set(typingRef, true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => remove(typingRef), 1500);
    };

    chatForm.onsubmit = async e => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text || !chatRef) return;
      await push(chatRef, {
        from: currentUser.uid,
        text,
        createdAt: Date.now()
      });
      chatInput.value = '';
      remove(typingRef);
    };

    // 🚨 Llamadas
    function startCall(targetUid, targetName) {
      currentCallId = currentUser.uid + '_' + targetUid;
      const callRef = ref(db, 'calls/' + currentCallId);
      set(callRef, {
        from: currentUser.uid,
        to: targetUid,
        status: 'calling',
        fromName: currentUser.displayName
      });
      setupWebRTC(currentCallId, true);
      callStatus.textContent = "Llamando a " + targetName;
      callTimer.textContent = "00:00";
      callModal.show();
      startCallTimer();
    }

    function listenForCalls() {
      onValue(ref(db, 'calls'), snap => {
        snap.forEach(c => {
          const data = c.val();
          const id = c.key;
          if (data.to === currentUser.uid && data.status === 'calling') {
            currentCallId = id;
            document.getElementById('incomingCallLabel').textContent = `${data.fromName} te está llamando`;
            incomingCallModal.show();

            btnAcceptCall.onclick = async () => {
              update(ref(db, 'calls/' + id), { status: 'accepted' });
              incomingCallModal.hide();
              setupWebRTC(id, false);
              callStatus.textContent = "En llamada con " + data.fromName;
              callTimer.textContent = "00:00";
              callModal.show();
              startCallTimer();
            };

            btnRejectCall.onclick = async () => {
              remove(ref(db, 'calls/' + id));
              incomingCallModal.hide();
            };
          }
        });
      });
    }

    btnEndCall.onclick = stopCall;

    async function setupWebRTC(callId, isCaller) {
      peerConnection = new RTCPeerConnection(servers);
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
      localAudio.srcObject = localStream;

      peerConnection.ontrack = e => remoteAudio.srcObject = e.streams[0];

      const callRef = ref(db, 'calls/' + callId);

      if (isCaller) {
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        update(callRef, { offer: offer.toJSON() });
      }

      onValue(callRef, async snap => {
        const data = snap.val();
        if (!data) return;

        if (!isCaller && data.offer && !peerConnection.currentRemoteDescription) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          update(callRef, { answer: answer.toJSON() });
        }

        if (data.answer && isCaller && !peerConnection.currentRemoteDescription) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        }
      });

      peerConnection.onicecandidate = e => {
        if (e.candidate) {
          const candRef = ref(db, `calls/${callId}/${isCaller ? 'callerCandidates' : 'calleeCandidates'}`);
          push(candRef, e.candidate.toJSON());
        }
      };

      onValue(ref(db, `calls/${callId}/${isCaller ? 'calleeCandidates' : 'callerCandidates'}`), snap => {
        snap.forEach(c => peerConnection.addIceCandidate(new RTCIceCandidate(c.val())));
      });
    }

    function startCallTimer() {
      let seconds = 0;
      callInterval = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2, "0");
        const s = String(seconds % 60).padStart(2, "0");
        callTimer.textContent = `${m}:${s}`;
      }, 1000);
    }

    function stopCall() {
      if (peerConnection) peerConnection.close();
      peerConnection = null;
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (currentCallId) remove(ref(db, 'calls/' + currentCallId));
      callModal.hide();
      clearInterval(callInterval);
    }

  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
