<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat 1 a 1 – Firebase + Voz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div id="alertContainer"></div>

    <!-- Login View -->
    <div id="loginView" class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="card-body text-center p-5">
            <h2 class="mb-4">Chat App</h2>
            <p class="text-muted mb-4">Ingresa con Google</p>
            <button id="btnLoginGoogle" class="btn btn-danger btn-lg w-100"><i class="bi bi-google"></i> Continuar con Google</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-chat-dots"></i> Usuarios</h2>
        <div>
          <img id="userAvatar" src="" class="rounded-circle me-2" width="40" height="40">
          <button id="btnLogout" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
        </div>
      </div>
      <ul id="usersList" class="list-group mb-4"></ul>
    </div>

    <!-- Chat Modal -->
    <div class="modal fade" id="chatModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
        <div class="modal-header"><div><h5 id="chatModalLabel" class="modal-title mb-0">Chat</h5><small id="typingStatus" class="text-muted"></small></div>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="chatHistory" class="mb-3" style="max-height:400px;overflow-y:auto;"></div>
          <form id="chatForm" class="d-flex"><input id="chatInput" class="form-control me-2" placeholder="Escribe..." autocomplete="off"/>
          <button class="btn btn-primary" type="submit">Enviar</button></form>
          <button id="btnCall" class="btn btn-outline-success w-100 mt-3"><i class="bi bi-telephone"></i> Llamar</button>
        </div>
      </div></div>
    </div>

    <!-- Incoming Call Modal -->
    <div class="modal fade" id="incomingCallModal" tabindex="-1">
      <div class="modal-dialog"><div class="modal-content text-center">
        <div class="modal-header"><h5 class="modal-title">Llamada entrante</h5></div>
        <div class="modal-body">
          <p id="incomingCaller">...</p>
          <button id="btnAcceptCall" class="btn btn-success me-2">Aceptar</button>
          <button id="btnRejectCall" class="btn btn-danger">Rechazar</button>
        </div>
      </div></div>
    </div>

    <!-- Call Modal -->
    <div class="modal fade" id="callModal" tabindex="-1">
      <div class="modal-dialog"><div class="modal-content text-center">
        <div class="modal-header"><h5 class="modal-title">Llamada en curso</h5></div>
        <div class="modal-body">
          <p id="callStatus">Conectando...</p>
          <button id="btnHangup" class="btn btn-danger mt-3">Colgar</button>
        </div>
      </div></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, set, push, onValue, onDisconnect, remove, off, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {/* tu config */};
  const app = initializeApp(firebaseConfig), analytics = getAnalytics(app);
  const auth = getAuth(app), db = getDatabase(app), provider = new GoogleAuthProvider();

  // DOM & estado
  const loginView = document.getElementById('loginView'), dashboardView = document.getElementById('dashboardView');
  const btnLoginGoogle = document.getElementById('btnLoginGoogle'), btnLogout = document.getElementById('btnLogout');
  const userAvatar = document.getElementById('userAvatar'), usersList = document.getElementById('usersList');
  const alertContainer = document.getElementById('alertContainer');
  const chatModal = new bootstrap.Modal(document.getElementById('chatModal'));
  const incomingCallModal = new bootstrap.Modal(document.getElementById('incomingCallModal'));
  const callModal = new bootstrap.Modal(document.getElementById('callModal'));
  const chatModalLabel = document.getElementById('chatModalLabel'), chatHistory = document.getElementById('chatHistory');
  const chatForm = document.getElementById('chatForm'), chatInput = document.getElementById('chatInput');
  const btnCall = document.getElementById('btnCall');
  const incomingCaller = document.getElementById('incomingCaller'), btnAcceptCall = document.getElementById('btnAcceptCall'), btnRejectCall = document.getElementById('btnRejectCall');
  const callStatus = document.getElementById('callStatus'), btnHangup = document.getElementById('btnHangup');

  let currentUser, chatPartner, chatRef, typingRef, partnerTypingRef;
  let peerConnection, localStream;
  const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  function showError(msg){
    const alert = document.createElement('div');
    alert.className='alert alert-danger alert-dismissible';
    alert.innerHTML=msg+'<button class="btn-close" data-bs-dismiss="alert"></button>';
    alertContainer.appendChild(alert);
    setTimeout(()=>alert.remove(),5000);
  }

  btnLoginGoogle.onclick = ()=>signInWithPopup(auth, provider).catch(e=>showError(e.message));
  btnLogout.onclick = ()=>{ if(chatRef) off(chatRef); if(partnerTypingRef) off(partnerTypingRef); signOut(auth) };

  onAuthStateChanged(auth,user=>{
    if(user){
      currentUser=user;
      loginView.classList.add('d-none'); dashboardView.classList.remove('d-none');
      userAvatar.src=user.photoURL;
      const myRef = ref(db,'presence/'+user.uid);
      set(myRef,{name:user.displayName,photo:user.photoURL});
      onDisconnect(myRef).remove();
      loadUsers();
      listenOffers();
    } else {
      loginView.classList.remove('d-none'); dashboardView.classList.add('d-none');
    }
  });

  function loadUsers(){
    onValue(ref(db,'presence'),snap=>{
      usersList.innerHTML='';
      snap.forEach(u=>{
        const uid=u.key; if(uid===currentUser.uid)return;
        const d=u.val();
        const li=document.createElement('li');
        li.className='list-group-item list-group-item-action d-flex align-items-center';
        li.innerHTML=`<img src="${d.photo}" class="rounded-circle me-3" width="30" height="30"><span>${d.name}</span>`;
        li.onclick=()=>openChat(uid,d.name);
        usersList.appendChild(li);
      })
    });
  }

  function openChat(partnerUid, partnerName){
    chatPartner=partnerUid;
    chatModalLabel.textContent='Chat con '+partnerName;
    chatHistory.innerHTML='';
    if(chatRef) off(chatRef); if(partnerTypingRef) off(partnerTypingRef);
    const chatId = currentUser.uid<partnerUid ? currentUser.uid+'_'+partnerUid : partnerUid+'_'+currentUser.uid;
    chatRef=ref(db,'chats/'+chatId);
    typingRef=ref(db,`typing/${chatId}/${currentUser.uid}`);
    partnerTypingRef=ref(db,`typing/${chatId}/${partnerUid}`);
    onValue(chatRef, snap=>{
      chatHistory.innerHTML='';
      snap.forEach(m=>{
        const data=m.val();
        const div=document.createElement('div');
        div.className=data.from===currentUser.uid?'text-end mb-2':'text-start mb-2';
        div.innerHTML=`<span class="badge ${data.from===currentUser.uid?'bg-primary':'bg-secondary'}">${data.text}</span><br><small class="text-muted">${new Date(data.createdAt).toLocaleTimeString()}</small>`;
        chatHistory.appendChild(div);
        if(data.from!==currentUser.uid)new AudioContext().resume().then(_=>{new AudioContext().createOscillator().connect(new AudioContext().destination);});
      });
      chatHistory.scrollTop=chatHistory.scrollHeight;
    });
    chatInput.oninput=()=>{
      set(typingRef,true);
      clearTimeout(chatInput._timeout);
      chatInput._timeout=setTimeout(()=>remove(typingRef),1500);
    };

    chatForm.onsubmit=e=>{
      e.preventDefault();
      const t=chatInput.value.trim();
      if(t){
        push(chatRef,{from:currentUser.uid,text:t,createdAt:Date.now()});
        chatInput.value=''; remove(typingRef);
      }
    };
    chatModal.show();
  }

  // ** Llamadas **
  btnCall.onclick = async()=>{
    if(!chatPartner)return;
    const callId = currentUser.uid+'_'+chatPartner;
    const callRef = ref(db,'calls/'+callId);
    await set(callRef,{from:currentUser.uid,status:'calling'});
    callModal.show(); callStatus.textContent='Llamando...';

    peerConnection=new RTCPeerConnection(servers);
    localStream=await navigator.mediaDevices.getUserMedia({audio:true});
    localStream.getTracks().forEach(track=>peerConnection.addTrack(track,localStream));
    peerConnection.onicecandidate=e=>e.candidate && push(callRef.child('candidates'),e.candidate.toJSON());
    peerConnection.ontrack = e=>{
      const a = new Audio(); a.srcObject=e.streams[0]; a.play();
    };

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    await update(callRef,{offer:offer});
    listenCall(callId);
  };

  function listenCall(callId){
    const callRef=ref(db,'calls/'+callId);
    onValue(callRef,async snap=>{
      const data=snap.val();
      if(!data) return;
      if(data.answer && !peerConnection.currentRemoteDescription){
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        callStatus.textContent='Conectado';
      }
      if(data.status==='ended'){
        endCall();
      }
    });
    onValue(callRef.child('candidates'),snap=>{
      snap.forEach(c=>peerConnection.addIceCandidate(new RTCIceCandidate(c.val())));
    });
  }

  async function listenOffers(){
    const presRef=ref(db,'presence/'+currentUser.uid);
    onValue(ref(db,'calls'),snap=>{
      snap.forEach(child=>{
        const [f,t] = child.key.split('_');
        if(t!==currentUser.uid) return;
        const data=child.val();
        if(data.status==='calling'){
          incomingCaller.textContent = `Llamada de ${data.from}`;
          incomingCallModal.show();
          incomingCallModal._callId = child.key;
        }
      });
    });
  }

  btnAcceptCall.onclick=async()=>{
    const callId = incomingCallModal._callId;
    incomingCallModal.hide();
    callModal.show(); callStatus.textContent='Conectando...';

    const callRef=ref(db,'calls/'+callId);
    peerConnection=new RTCPeerConnection(servers);
    localStream=await navigator.mediaDevices.getUserMedia({audio:true});
    localStream.getTracks().forEach(track=>peerConnection.addTrack(track,localStream));
    peerConnection.onicecandidate=e=>e.candidate && push(callRef.child('candidates'),e.candidate.toJSON());
    peerConnection.ontrack = e=>{ const a=new Audio(); a.srcObject=e.streams[0]; a.play(); };

    const snap = await new Promise(res=>onValue(callRef,snap=>res(snap)));
    await peerConnection.setRemoteDescription(new RTCSessionDescription(snap.val().offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    await update(callRef,{answer:answer,status:'answered'});
    listenCall(callId);
  };

  btnRejectCall.onclick=()=>{
    const callId = incomingCallModal._callId;
    update(ref(db,'calls/'+callId),{status:'ended'});
    incomingCallModal.hide();
  };

  btnHangup.onclick=()=>{
    const callId = currentUser.uid+'_'+chatPartner;
    update(ref(db,'calls/'+callId),{status:'ended'});
    endCall();
  };

  function endCall(){
    peerConnection?.close();
    localStream?.getTracks().forEach(t=>t.stop());
    callModal.hide();
    remove(ref(db,'calls/'+currentUser.uid+'_'+chatPartner));
  }
  </script>
</body>
</html>
