<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat con Llamadas 1:1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .user-active { background-color: #e8f5e9; }
    .call-modal {
      text-align: center;
      padding: 20px;
    }
    .call-timer {
      font-size: 24px;
      margin: 20px 0;
    }
    .call-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 15px;
    }
    #remoteAudio { display: none; }
    .ringing {
      animation: ring 1.5s infinite;
    }
    @keyframes ring {
      0% { transform: rotate(0); }
      25% { transform: rotate(15deg); }
      50% { transform: rotate(0); }
      75% { transform: rotate(-15deg); }
      100% { transform: rotate(0); }
    }
    #chatMessages {
      height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <!-- Vista de Login -->
    <div id="loginView" class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="card-body text-center p-5">
            <h2 class="mb-4">Chat con Llamadas</h2>
            <button id="btnLogin" class="btn btn-danger btn-lg w-100">
              <i class="bi bi-google"></i> Ingresar con Google
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Vista Principal -->
    <div id="appView" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people-fill"></i> Usuarios</h2>
        <div>
          <img id="userAvatar" src="" class="rounded-circle me-2" width="40" height="40">
          <button id="btnLogout" class="btn btn-outline-danger">Salir</button>
        </div>
      </div>
      
      <div class="card shadow mb-4">
        <div class="card-body p-0">
          <ul id="usersList" class="list-group list-group-flush"></ul>
        </div>
      </div>
    </div>

    <!-- Modal de Chat -->
    <div class="modal fade" id="chatModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="chatTitle">Chat</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="chatMessages"></div>
            <form id="chatForm" class="mt-3">
              <div class="input-group">
                <input type="text" id="messageInput" class="form-control" placeholder="Escribe un mensaje...">
                <button class="btn btn-primary" type="submit">Enviar</button>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button id="btnStartCall" class="btn btn-success">
              <i class="bi bi-telephone-fill"></i> Llamar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal de Llamada -->
    <div class="modal fade" id="callModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body call-modal">
            <img id="callAvatar" class="call-avatar ringing" src="">
            <h4 id="callName"></h4>
            <div id="callStatus">Llamando...</div>
            <div id="callTimer" class="call-timer d-none">00:00</div>
            <div class="mt-4">
              <button id="btnAcceptCall" class="btn btn-success btn-lg mx-2 d-none">
                <i class="bi bi-telephone-fill"></i>
              </button>
              <button id="btnRejectCall" class="btn btn-danger btn-lg mx-2 d-none">
                <i class="bi bi-telephone-x-fill"></i>
              </button>
              <button id="btnEndCall" class="btn btn-danger btn-lg mx-2 d-none">
                <i class="bi bi-telephone-x-fill"></i> Colgar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>
    <audio id="ringtone" loop src="https://assets.mixkit.co/sfx/preview/mixkit-phone-ring-1550.mp3"></audio>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    // Importaciones Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, onDisconnect, remove, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
      authDomain: "llamapp-c8d6c.firebaseapp.com",
      databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
      projectId: "llamapp-c8d6c",
      storageBucket: "llamapp-c8d6c.firebasestorage.app",
      messagingSenderId: "132119278171",
      appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
      measurementId: "G-4VN80ZMS5L"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    // Elementos del DOM
    const loginView = document.getElementById('loginView');
    const appView = document.getElementById('appView');
    const btnLogin = document.getElementById('btnLogin');
    const btnLogout = document.getElementById('btnLogout');
    const userAvatar = document.getElementById('userAvatar');
    const usersList = document.getElementById('usersList');
    const chatModal = new bootstrap.Modal('#chatModal');
    const callModal = new bootstrap.Modal('#callModal');
    const chatTitle = document.getElementById('chatTitle');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const chatForm = document.getElementById('chatForm');
    const btnStartCall = document.getElementById('btnStartCall');
    const callAvatar = document.getElementById('callAvatar');
    const callName = document.getElementById('callName');
    const callStatus = document.getElementById('callStatus');
    const callTimer = document.getElementById('callTimer');
    const btnAcceptCall = document.getElementById('btnAcceptCall');
    const btnRejectCall = document.getElementById('btnRejectCall');
    const btnEndCall = document.getElementById('btnEndCall');
    const remoteAudio = document.getElementById('remoteAudio');
    const ringtone = document.getElementById('ringtone');

    // Variables de estado
    let currentUser = null;
    let currentChat = null;
    let peerConnection = null;
    let localStream = null;
    let callStartTime = null;
    let callInterval = null;
    let currentCall = null;

    // Configuración WebRTC
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    // Iniciar sesión con Google
    btnLogin.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Error al iniciar sesión:", error);
        alert("Error al iniciar sesión: " + error.message);
      }
    });

    // Cerrar sesión
    btnLogout.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Error al cerrar sesión:", error);
      }
    });

    // Observar estado de autenticación
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loginView.classList.add('d-none');
        appView.classList.remove('d-none');
        userAvatar.src = user.photoURL;
        setupPresence();
        loadUsers();
        setupCallListener();
      } else {
        currentUser = null;
        loginView.classList.remove('d-none');
        appView.classList.add('d-none');
      }
    });

    // Configurar presencia del usuario
    function setupPresence() {
      const userStatusRef = ref(db, `presence/${currentUser.uid}`);
      
      // Establecer estado online
      set(userStatusRef, {
        name: currentUser.displayName,
        photo: currentUser.photoURL,
        status: 'online',
        lastOnline: Date.now()
      });
      
      // Limpiar al desconectarse
      onDisconnect(userStatusRef).remove();
    }

    // Cargar lista de usuarios
    function loadUsers() {
      const usersRef = ref(db, 'presence');
      
      onValue(usersRef, (snapshot) => {
        usersList.innerHTML = '';
        snapshot.forEach((childSnapshot) => {
          const uid = childSnapshot.key;
          const user = childSnapshot.val();
          
          if (uid !== currentUser.uid) {
            const li = document.createElement('li');
            li.className = `list-group-item list-group-item-action ${user.status === 'online' ? 'user-active' : ''}`;
            li.innerHTML = `
              <div class="d-flex align-items-center">
                <img src="${user.photo}" class="rounded-circle me-3" width="40" height="40">
                <div>
                  <h6 class="mb-0">${user.name}</h6>
                  <small class="text-muted">${user.status === 'online' ? 'En línea' : 'Desconectado'}</small>
                </div>
              </div>
            `;
            
            li.addEventListener('click', () => openChat(uid, user.name, user.photo));
            usersList.appendChild(li);
          }
        });
      });
    }

    // Abrir chat con usuario
    function openChat(uid, name, photo) {
      currentChat = { uid, name, photo };
      chatTitle.textContent = `Chat con ${name}`;
      chatMessages.innerHTML = '';
      
      // Cargar mensajes
      const chatId = generateChatId(currentUser.uid, uid);
      const messagesRef = ref(db, `chats/${chatId}`);
      
      onValue(messagesRef, (snapshot) => {
        chatMessages.innerHTML = '';
        snapshot.forEach((childSnapshot) => {
          const message = childSnapshot.val();
          displayMessage(message);
        });
        
        // Scroll al final
        chatMessages.scrollTop = chatMessages.scrollHeight;
      });
      
      chatModal.show();
    }

    // Generar ID de chat
    function generateChatId(uid1, uid2) {
      return [uid1, uid2].sort().join('_');
    }

    // Mostrar mensaje en el chat
    function displayMessage(message) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `mb-2 ${message.from === currentUser.uid ? 'text-end' : 'text-start'}`;
      messageDiv.innerHTML = `
        <span class="badge ${message.from === currentUser.uid ? 'bg-primary' : 'bg-secondary'}">
          ${message.text}
        </span>
        <div class="small text-muted">
          ${new Date(message.createdAt).toLocaleTimeString()}
        </div>
      `;
      chatMessages.appendChild(messageDiv);
    }

    // Enviar mensaje
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      
      if (text && currentChat) {
        const chatId = generateChatId(currentUser.uid, currentChat.uid);
        const messagesRef = ref(db, `chats/${chatId}`);
        
        push(messagesRef, {
          from: currentUser.uid,
          text,
          createdAt: Date.now()
        });
        
        messageInput.value = '';
      }
    });

    // Configurar listener de llamadas
    function setupCallListener() {
      const callRef = ref(db, `calls/${currentUser.uid}`);
      
      onValue(callRef, (snapshot) => {
        const callData = snapshot.val();
        
        if (callData && callData.offer && !currentCall) {
          currentCall = {
            from: callData.offer.from,
            offer: new RTCSessionDescription(callData.offer),
            name: callData.offer.callerName,
            photo: callData.offer.callerPhoto
          };
          
          showIncomingCall();
        }
      });
    }

    // Mostrar llamada entrante
    function showIncomingCall() {
      callAvatar.src = currentCall.photo;
      callName.textContent = currentCall.name;
      callStatus.textContent = "Llamada entrante";
      callTimer.classList.add('d-none');
      btnAcceptCall.classList.remove('d-none');
      btnRejectCall.classList.remove('d-none');
      btnEndCall.classList.add('d-none');
      
      ringtone.play();
      callModal.show();
      
      // Timeout para llamada no contestada (30 segundos)
      setTimeout(() => {
        if (callModal._isShown && !peerConnection) {
          endCall();
        }
      }, 30000);
    }

    // Iniciar llamada
    btnStartCall.addEventListener('click', async () => {
      if (!currentChat) return;
      
      callAvatar.src = currentChat.photo;
      callName.textContent = currentChat.name;
      callStatus.textContent = "Llamando...";
      callTimer.classList.add('d-none');
      btnAcceptCall.classList.add('d-none');
      btnRejectCall.classList.add('d-none');
      btnEndCall.classList.remove('d-none');
      
      callModal.show();
      
      try {
        await startCall(currentChat.uid);
      } catch (error) {
        console.error("Error al iniciar llamada:", error);
        endCall();
      }
    });

    // Función para iniciar llamada
    async function startCall(calleeId) {
      // Limpiar llamadas anteriores
      await remove(ref(db, `calls/${currentUser.uid}`));
      
      // Configurar conexión peer
      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      
      // Manejar candidatos ICE
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          push(ref(db, `calls/${calleeId}/candidates`), {
            candidate: event.candidate.candidate,
            sdpMid: event.candidate.sdpMid,
            sdpMLineIndex: event.candidate.sdpMLineIndex
          });
        }
      };
      
      // Cuando se recibe el stream remoto
      peerConnection.ontrack = (event) => {
        remoteAudio.srcObject = event.streams[0];
        callConnected();
      };
      
      // Crear oferta
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      
      // Enviar oferta
      await set(ref(db, `calls/${calleeId}/offer`), {
        sdp: offer.sdp,
        type: offer.type,
        from: currentUser.uid,
        callerName: currentUser.displayName,
        callerPhoto: currentUser.photoURL,
        timestamp: Date.now()
      });
      
      // Escuchar respuesta
      listenForAnswer(calleeId);
    }

    // Escuchar respuesta a la llamada
    function listenForAnswer(callerId) {
      const answerRef = ref(db, `calls/${currentUser.uid}/answer`);
      
      onValue(answerRef, async (snapshot) => {
        if (snapshot.exists() && peerConnection) {
          const answer = snapshot.val();
          await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
          remove(answerRef);
        }
      });
    }

    // Aceptar llamada
    btnAcceptCall.addEventListener('click', async () => {
      if (!currentCall) return;
      
      ringtone.pause();
      callStatus.textContent = "Conectando...";
      
      try {
        // Configurar conexión peer
        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        // Manejar candidatos ICE
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            push(ref(db, `calls/${currentCall.from}/candidates`), {
              candidate: event.candidate.candidate,
              sdpMid: event.candidate.sdpMid,
              sdpMLineIndex: event.candidate.sdpMLineIndex
            });
          }
        };
        
        // Cuando se recibe el stream remoto
        peerConnection.ontrack = (event) => {
          remoteAudio.srcObject = event.streams[0];
          callConnected();
        };
        
        // Procesar oferta
        await peerConnection.setRemoteDescription(currentCall.offer);
        
        // Crear respuesta
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        
        // Enviar respuesta
        await set(ref(db, `calls/${currentCall.from}/answer`), {
          sdp: answer.sdp,
          type: answer.type
        });
        
        // Limpiar datos de llamada
        await remove(ref(db, `calls/${currentUser.uid}/offer`));
        currentCall = null;
      } catch (error) {
        console.error("Error al aceptar llamada:", error);
        endCall();
      }
    });

    // Llamada conectada
    function callConnected() {
      callStatus.textContent = "En llamada";
      callTimer.classList.remove('d-none');
      btnAcceptCall.classList.add('d-none');
      btnRejectCall.classList.add('d-none');
      btnEndCall.classList.remove('d-none');
      
      startCallTimer();
    }

    // Iniciar temporizador de llamada
    function startCallTimer() {
      callStartTime = Date.now();
      clearInterval(callInterval);
      callInterval = setInterval(updateCallTimer, 1000);
    }

    // Actualizar temporizador
    function updateCallTimer() {
      const seconds = Math.floor((Date.now() - callStartTime) / 1000);
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;
      callTimer.textContent = `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
    }

    // Rechazar/terminar llamada
    btnRejectCall.addEventListener('click', endCall);
    btnEndCall.addEventListener('click', endCall);

    // Finalizar llamada
    async function endCall() {
      // Detener medios
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      
      // Cerrar conexión peer
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      
      // Limpiar UI
      remoteAudio.srcObject = null;
      ringtone.pause();
      callModal.hide();
      clearInterval(callInterval);
      
      // Limpiar datos de Firebase
      if (currentUser) {
        await remove(ref(db, `calls/${currentUser.uid}`));
      }
      
      if (currentCall) {
        await remove(ref(db, `calls/${currentCall.from}`));
        currentCall = null;
      }
      
      if (currentChat) {
        await remove(ref(db, `calls/${currentChat.uid}`));
      }
    }

    // Cerrar llamada si se cierra el modal
    document.getElementById('callModal').addEventListener('hidden.bs.modal', () => {
      if (peerConnection) {
        endCall();
      }
    });
  </script>
</body>
</html>
