<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LlamApp - Chat en Tiempo Real</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #f8f9fc;
        }
        
        body {
            background-color: #f5f7fb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .chat-container {
            height: calc(100vh - 120px);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        
        .messages-container {
            overflow-y: auto;
            height: calc(100% - 70px);
            background-color: #f8fafc;
            padding: 15px;
            scrollbar-width: thin;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .message-card {
            max-width: 70%;
            border-radius: 15px;
            padding: 10px 15px;
            margin-bottom: 10px;
            position: relative;
            word-wrap: break-word;
        }
        
        .sent-message {
            background-color: var(--primary-color);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        
        .received-message {
            background-color: #e9ecef;
            color: #212529;
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }
        
        .message-time {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 5px;
            display: block;
            text-align: right;
        }
        
        .online-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            background-color: #28a745;
        }
        
        .offline-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            background-color: #6c757d;
        }
        
        .contact-item:hover {
            background-color: #f1f3f9;
            cursor: pointer;
        }
        
        .search-results {
            position: absolute;
            width: 100%;
            z-index: 1000;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .typing-indicator {
            font-size: 0.8rem;
            color: #6c757d;
            font-style: italic;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-chat-dots-fill me-2"></i>LlamApp
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" id="navHome">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="navContacts">Contactos</a>
                    </li>
                </ul>
                <div id="authButtons"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid mt-3">
        <!-- Login View -->
        <div id="loginView" class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <h2 class="mb-4">Bienvenido a LlamApp</h2>
                        <p class="text-muted mb-4">Conéctate con tus amigos en tiempo real</p>
                        <button id="btnLoginGoogle" class="btn btn-danger btn-lg w-100 d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-google"></i> Continuar con Google
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboardView" class="d-none">
            <div class="row g-3">
                <!-- Sidebar -->
                <div class="col-md-4 col-lg-3">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-white border-bottom">
                            <div class="d-flex align-items-center">
                                <img id="currentUserAvatar" src="" alt="Avatar" class="user-avatar me-2">
                                <div>
                                    <h6 class="mb-0" id="currentUserName"></h6>
                                    <small class="text-muted" id="currentUserEmail"></small>
                                </div>
                            </div>
                        </div>
                        <div class="card-body p-0">
                            <!-- Search Bar -->
                            <div class="p-3 border-bottom">
                                <div class="input-group">
                                    <input type="text" id="userSearch" class="form-control" placeholder="Buscar usuarios...">
                                    <button class="btn btn-outline-secondary" type="button" id="btnSearch">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                                <div id="searchResults" class="search-results card d-none mt-1"></div>
                            </div>
                            
                            <!-- Contacts List -->
                            <div id="contactsList" class="list-group list-group-flush">
                                <div class="list-group-item text-center py-4">
                                    <i class="bi bi-people fs-1 text-muted"></i>
                                    <p class="text-muted mt-2">Tus contactos aparecerán aquí</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="col-md-8 col-lg-9">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center border-bottom">
                            <div id="chatHeaderInfo" class="d-flex align-items-center">
                                <h5 class="mb-0">Selecciona un chat</h5>
                            </div>
                            <div id="chatHeaderActions" class="d-none">
                                <div class="d-flex align-items-center">
                                    <span id="typingIndicator" class="typing-indicator me-3"></span>
                                    <button class="btn btn-sm btn-outline-danger" id="btnClearChat">
                                        <i class="bi bi-trash"></i> Limpiar chat
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="card-body p-0">
                            <div id="emptyChat" class="d-flex flex-column align-items-center justify-content-center h-100">
                                <i class="bi bi-chat-left-text fs-1 text-muted"></i>
                                <h4 class="mt-3 text-muted">Selecciona una conversación</h4>
                                <p class="text-muted">O busca nuevos contactos para chatear</p>
                            </div>
                            <div id="activeChat" class="d-none h-100">
                                <div class="chat-container d-flex flex-column">
                                    <div class="messages-container" id="messagesContainer"></div>
                                    <div class="p-3 border-top bg-white">
                                        <div class="input-group">
                                            <input type="text" id="messageInput" class="form-control" placeholder="Escribe un mensaje...">
                                            <button class="btn btn-primary" id="btnSendMessage">
                                                <i class="bi bi-send-fill"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Firebase Configuration and Initialization
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged,
            getIdToken
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getDatabase, 
            ref, 
            push, 
            onValue, 
            off, 
            set, 
            query, 
            orderByChild, 
            equalTo,
            startAt,
            endAt,
            remove,
            onChildAdded,
            onChildRemoved,
            update,
            onDisconnect,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
            authDomain: "llamapp-c8d6c.firebaseapp.com",
            databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
            projectId: "llamapp-c8d6c",
            storageBucket: "llamapp-c8d6c.appspot.com",
            messagingSenderId: "132119278171",
            appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
            measurementId: "G-4VN80ZMS5L"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // DOM Elements
        const authButtonsDiv = document.getElementById('authButtons');
        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const btnLoginGoogle = document.getElementById('btnLoginGoogle');
        const currentUserName = document.getElementById('currentUserName');
        const currentUserEmail = document.getElementById('currentUserEmail');
        const currentUserAvatar = document.getElementById('currentUserAvatar');
        const userSearch = document.getElementById('userSearch');
        const btnSearch = document.getElementById('btnSearch');
        const searchResults = document.getElementById('searchResults');
        const contactsList = document.getElementById('contactsList');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const btnSendMessage = document.getElementById('btnSendMessage');
        const emptyChat = document.getElementById('emptyChat');
        const activeChat = document.getElementById('activeChat');
        const chatHeaderInfo = document.getElementById('chatHeaderInfo');
        const chatHeaderActions = document.getElementById('chatHeaderActions');
        const btnClearChat = document.getElementById('btnClearChat');
        const typingIndicator = document.getElementById('typingIndicator');

        // App State
        let currentUser = null;
        let currentChat = null;
        let usersRef, contactsRef, messagesRef, presenceRef, typingRef;
        let isTypingTimeout;

        // Initialize the app
        function initApp() {
            renderAuthButtons();
            setupEventListeners();
        }

        // Setup event listeners
        function setupEventListeners() {
            // Login button
            if (btnLoginGoogle) {
                btnLoginGoogle.addEventListener('click', loginWithGoogle);
            }

            // Send message
            btnSendMessage.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            // Typing indicator
            messageInput.addEventListener('input', handleTyping);

            // User search
            userSearch.addEventListener('input', searchUsers);
            btnSearch.addEventListener('click', searchUsers);

            // Clear chat
            btnClearChat.addEventListener('click', clearChat);
        }

        // Auth functions
        async function loginWithGoogle() {
            try {
                const result = await signInWithPopup(auth, provider);
                currentUser = result.user;
                initUserData();
            } catch (error) {
                showAlert('Error al iniciar sesión: ' + error.message, 'danger');
            }
        }

        async function logoutUser() {
            try {
                // Update presence status before logging out
                if (currentUser) {
                    await update(ref(database, `presence/${currentUser.uid}`), {
                        status: 'offline',
                        lastChanged: serverTimestamp()
                    });
                    
                    // Remove typing status
                    await set(ref(database, `typing/${currentUser.uid}`), null);
                }
                
                await signOut(auth);
                currentUser = null;
                currentChat = null;
                
                // Clean up listeners
                if (usersRef) off(usersRef);
                if (contactsRef) off(contactsRef);
                if (messagesRef) off(messagesRef);
                if (presenceRef) off(presenceRef);
                if (typingRef) off(typingRef);
                
                showView('login');
                renderAuthButtons();
            } catch (error) {
                showAlert('Error al cerrar sesión: ' + error.message, 'danger');
            }
        }

        // Render auth buttons
        function renderAuthButtons() {
            if (currentUser) {
                authButtonsDiv.innerHTML = `
                    <div class="dropdown">
                        <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown">
                            <img src="${currentUser.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUser.displayName || currentUser.email)}" 
                                 alt="Avatar" class="user-avatar me-2">
                            ${currentUser.displayName || currentUser.email.split('@')[0]}
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><button class="dropdown-item" id="btnLogout">Cerrar sesión</button></li>
                        </ul>
                    </div>
                `;
                
                document.getElementById('btnLogout').addEventListener('click', logoutUser);
            } else {
                authButtonsDiv.innerHTML = `
                    <button id="btnLoginHeader" class="btn btn-outline-light">
                        <i class="bi bi-google me-1"></i> Iniciar sesión
                    </button>
                `;
                
                document.getElementById('btnLoginHeader').addEventListener('click', loginWithGoogle);
            }
        }

        // Show view based on auth state
        function showView(view) {
            if (view === 'login') {
                loginView.classList.remove('d-none');
                dashboardView.classList.add('d-none');
            } else {
                loginView.classList.add('d-none');
                dashboardView.classList.remove('d-none');
            }
        }

        // Initialize user data after login
        function initUserData() {
            // Update UI
            currentUserName.textContent = currentUser.displayName || currentUser.email.split('@')[0];
            currentUserEmail.textContent = currentUser.email;
            currentUserAvatar.src = currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName || currentUser.email)}`;
            
            // Show dashboard
            showView('dashboard');
            renderAuthButtons();
            
            // Initialize Firebase references
            usersRef = ref(database, 'users');
            contactsRef = ref(database, `userContacts/${currentUser.uid}`);
            messagesRef = ref(database, 'messages');
            presenceRef = ref(database, 'presence');
            typingRef = ref(database, 'typing');
            
            // Save user data to database
            set(ref(database, `users/${currentUser.uid}`), {
                uid: currentUser.uid,
                displayName: currentUser.displayName,
                email: currentUser.email,
                photoURL: currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName || currentUser.email)}`,
                createdAt: serverTimestamp()
            });
            
            // Set presence status
            const userPresenceRef = ref(database, `presence/${currentUser.uid}`);
            set(userPresenceRef, {
                status: 'online',
                lastChanged: serverTimestamp()
            });
            
            // Handle disconnect
            onDisconnect(userPresenceRef).update({
                status: 'offline',
                lastChanged: serverTimestamp()
            });
            
            // Load contacts
            loadContacts();
    // Listen for new contacts
            onChildAdded(contactsRef, (snapshot) => {
                const contactId = snapshot.key;
                getUserData(contactId, (user) => {
                    if (user) {
                        addContactToUI(user);
                    }
                });
            });
            
            // Listen for removed contacts
            onChildRemoved(contactsRef, (snapshot) => {
                const contactId = snapshot.key;
                const contactElement = document.getElementById(`contact-${contactId}`);
                if (contactElement) {
                    contactElement.remove();
                }
            });
        }

        // Load user contacts
        function loadContacts() {
            onValue(contactsRef, (snapshot) => {
                contactsList.innerHTML = '';
                
                if (snapshot.exists()) {
                    const contacts = snapshot.val();
                    Object.keys(contacts).forEach(contactId => {
                        getUserData(contactId, (user) => {
                            if (user) {
                                addContactToUI(user);
                            }
                        });
                    });
                } else {
                    contactsList.innerHTML = `
                        <div class="list-group-item text-center py-4">
                            <i class="bi bi-people fs-1 text-muted"></i>
                            <p class="text-muted mt-2">No tienes contactos aún</p>
                            <p class="text-muted">Busca usuarios para agregarlos</p>
                        </div>
                    `;
                }
            });
        }

        // Add contact to UI
        function addContactToUI(user) {
            // Check if contact already exists in UI
            if (document.getElementById(`contact-${user.uid}`)) return;
            
            // Get presence status
            getPresenceStatus(user.uid, (status) => {
                const contactElement = document.createElement('div');
                contactElement.id = `contact-${user.uid}`;
                contactElement.className = 'list-group-item list-group-item-action contact-item';
                contactElement.innerHTML = `
                    <div class="d-flex align-items-center">
                        <img src="${user.photoURL}" alt="${user.displayName}" class="user-avatar me-3">
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-center">
                                <h6 class="mb-0">${user.displayName}</h6>
                                <small class="text-muted">
                                    ${status === 'online' ? 
                                        '<span class="online-badge"></span>En línea' : 
                                        '<span class="offline-badge"></span>Desconectado'}
                                </small>
                            </div>
                            <small class="text-muted">${user.email}</small>
                        </div>
                    </div>
                `;
                
                contactElement.addEventListener('click', () => {
                    openChat(user);
                });
                
                contactsList.prepend(contactElement);
            });
        }

        // Search users
        function searchUsers() {
            const searchTerm = userSearch.value.trim().toLowerCase();
            
            if (searchTerm.length < 1) {
                searchResults.classList.add('d-none');
                return;
            }
            
            const usersQuery = query(
                ref(database, 'users'),
                orderByChild('displayName'),
                startAt(searchTerm),
                endAt(searchTerm + '\uf8ff')
            );
            
            onValue(usersQuery, (snapshot) => {
                searchResults.innerHTML = '';
                searchResults.classList.remove('d-none');
                
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const user = childSnapshot.val();
                        
                        // Don't show current user in results
                        if (user.uid === currentUser.uid) return;
                        
                        // Check if user is already a contact
                        getContactStatus(user.uid, (isContact) => {
                            const userElement = document.createElement('div');
                            userElement.className = 'list-group-item list-group-item-action';
                            userElement.innerHTML = `
                                <div class="d-flex align-items-center justify-content-between">
                                    <div class="d-flex align-items-center">
                                        <img src="${user.photoURL}" alt="${user.displayName}" class="user-avatar me-3">
                                        <div>
                                            <h6 class="mb-0">${user.displayName}</h6>
                                            <small class="text-muted">${user.email}</small>
                                        </div>
                                    </div>
                                    <button class="btn btn-sm ${isContact ? 'btn-outline-secondary disabled' : 'btn-primary'}" 
                                            data-user-id="${user.uid}">
                                        ${isContact ? 'Agregado' : 'Agregar'}
                                    </button>
                                </div>
                            `;
                            
                            if (!isContact) {
                                userElement.querySelector('button').addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    addContact(user.uid);
                                });
                            }
                            
                            userElement.addEventListener('click', () => {
                                openChat(user);
                                searchResults.classList.add('d-none');
                                userSearch.value = '';
                            });
                            
                            searchResults.appendChild(userElement);
                        });
                    });
                } else {
                    searchResults.innerHTML = `
                        <div class="list-group-item text-center py-3">
                            No se encontraron usuarios
                        </div>
                    `;
                }
            }, { onlyOnce: true });
        }

        // Add contact
        function addContact(contactId) {
            set(ref(database, `userContacts/${currentUser.uid}/${contactId}`), true);
            set(ref(database, `userContacts/${contactId}/${currentUser.uid}`), true);
            
            showAlert('Contacto agregado correctamente', 'success');
        }

        // Get contact status
        function getContactStatus(contactId, callback) {
            onValue(ref(database, `userContacts/${currentUser.uid}/${contactId}`), (snapshot) => {
                callback(snapshot.exists());
            }, { onlyOnce: true });
        }

        // Get user data
        function getUserData(userId, callback) {
            onValue(ref(database, `users/${userId}`), (snapshot) => {
                callback(snapshot.exists() ? snapshot.val() : null);
            }, { onlyOnce: true });
        }

        // Get presence status
        function getPresenceStatus(userId, callback) {
            onValue(ref(database, `presence/${userId}/status`), (snapshot) => {
                callback(snapshot.exists() ? snapshot.val() : 'offline');
            });
        }

        // Open chat with user
        function openChat(user) {
            currentChat = user;
            
            // Update UI
            chatHeaderInfo.innerHTML = `
                <div class="d-flex align-items-center">
                    <img src="${user.photoURL}" alt="${user.displayName}" class="user-avatar me-2">
                    <div>
                        <h5 class="mb-0">${user.displayName}</h5>
                        <small class="text-muted" id="chatStatus">
                            ${user.status === 'online' ? 
                                '<span class="online-badge"></span>En línea' : 
                                '<span class="offline-badge"></span>Desconectado'}
                        </small>
                    </div>
                </div>
            `;
chatHeaderActions.classList.remove('d-none');
            emptyChat.classList.add('d-none');
            activeChat.classList.remove('d-none');
            messageInput.focus();
            
            // Update presence status in real-time
            onValue(ref(database, `presence/${user.uid}/status`), (snapshot) => {
                const statusElement = document.getElementById('chatStatus');
                if (statusElement) {
                    statusElement.innerHTML = snapshot.exists() ? 
                        (snapshot.val() === 'online' ? 
                            '<span class="online-badge"></span>En línea' : 
                            '<span class="offline-badge"></span>Desconectado') : 
                        '<span class="offline-badge"></span>Desconectado';
                }
            });
            
            // Listen for typing status
            onValue(ref(database, `typing/${user.uid}`), (snapshot) => {
                if (snapshot.exists() && snapshot.val().isTyping) {
                    typingIndicator.textContent = `${user.displayName} está escribiendo...`;
                } else {
                    typingIndicator.textContent = '';
                }
            });
            
            // Load messages
            loadMessages();
        }

        // Load messages for current chat
        function loadMessages() {
            // Clear previous listener
            if (messagesRef) off(messagesRef);
            
            messagesContainer.innerHTML = '<div class="text-center py-4 text-muted">Cargando mensajes...</div>';
            
            // Query messages between current user and chat user
            const chatId = [currentUser.uid, currentChat.uid].sort().join('_');
            messagesRef = ref(database, `messages/${chatId}`);
            
            onValue(messagesRef, (snapshot) => {
                messagesContainer.innerHTML = '';
                
                if (snapshot.exists()) {
                    const messages = [];
                    
                    snapshot.forEach((childSnapshot) => {
                        messages.push({
                            id: childSnapshot.key,
                            ...childSnapshot.val()
                        });
                    });
                    
                    // Sort messages by timestamp
                    messages.sort((a, b) => a.timestamp - b.timestamp);
                    
                    // Display messages
                    messages.forEach(message => {
                        displayMessage(message);
                    });
                    
                    // Scroll to bottom
                    setTimeout(() => {
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }, 100);
                } else {
                    messagesContainer.innerHTML = `
                        <div class="text-center py-4 text-muted">
                            No hay mensajes aún. ¡Envía el primero!
                        </div>
                    `;
                }
            });
        }

        // Display a message in the chat
        function displayMessage(message) {
            const isCurrentUser = message.senderId === currentUser.uid;
            const messageElement = document.createElement('div');
            
            messageElement.className = `d-flex mb-3 ${isCurrentUser ? 'justify-content-end' : 'justify-content-start'}`;
            messageElement.innerHTML = `
                <div class="message-card ${isCurrentUser ? 'sent-message' : 'received-message'}">
                    <p class="mb-0">${message.text}</p>
                    <small class="message-time">
                        ${formatMessageTime(message.timestamp)}
                    </small>
                </div>
            `;
            
            messagesContainer.appendChild(messageElement);
        }

        // Format message time
        function formatMessageTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Send message
        function sendMessage() {
            const text = messageInput.value.trim();
            
            if (!text || !currentChat) return;
            
            // Generate chat ID (combination of both user IDs sorted)
            const chatId = [currentUser.uid, currentChat.uid].sort().join('_');
            
            // Create message object
            const message = {
                senderId: currentUser.uid,
                receiverId: currentChat.uid,
                text: text,
                timestamp: Date.now()
            };
            
            // Push message to database
            push(ref(database, `messages/${chatId}`), message)
                .then(() => {
                    messageInput.value = '';
                    
                    // Clear typing status
                    set(ref(database, `typing/${currentUser.uid}`), {
                        isTyping: false,
                        lastTyping: serverTimestamp()
                    });
                    
                    // Scroll to bottom
                    setTimeout(() => {
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }, 100);
                })
                .catch(error => {
                    showAlert('Error al enviar mensaje: ' + error.message, 'danger');
                });
        }

        // Handle typing indicator
        function handleTyping() {
            if (!currentChat) return;
            
            // Set typing status
            set(ref(database, `typing/${currentUser.uid}`), {
                isTyping: true,
                lastTyping: serverTimestamp()
            });
            
            // Clear previous timeout
            if (isTypingTimeout) clearTimeout(isTypingTimeout);
            
            // Set timeout to mark as not typing after 3 seconds
            isTypingTimeout = setTimeout(() => {
                set(ref(database, `typing/${currentUser.uid}`), {
                    isTyping: false,
                    lastTyping: serverTimestamp()
                });
            }, 3000);
        }

        // Clear chat
        function clearChat() {
            if (!currentChat || !confirm('¿Estás seguro de que quieres borrar este chat? Esta acción no se puede deshacer.')) {
                return;
            }
            
            const chatId = [currentUser.uid, currentChat.uid].sort().join('_');
            remove(ref(database, `messages/${chatId}`))
                .then(() => {
                    showAlert('Chat borrado correctamente', 'success');
                })
                .catch(error => {
                    showAlert('Error al borrar chat: ' + error.message, 'danger');
                });
        }

        // Show alert
        function showAlert(message, type) {
            const alertElement = document.createElement('div');
            alertElement.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 end-0 m-3`;
            alertElement.setAttribute('role', 'alert');
            alertElement.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.appendChild(alertElement);
            
            // Auto dismiss after 5 seconds
            setTimeout(() => {
                alertElement.classList.remove('show');
                setTimeout(() => {
                    alertElement.remove();
                }, 150);
            }, 5000);
        }
        // Auth state listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                initUserData();
            } else {
                currentUser = null;
                showView('login');
                renderAuthButtons();
            }
        });

        // Initialize the app
        initApp();
    </script>

    <!-- Bootstrap 5.3 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
