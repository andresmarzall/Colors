<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat 1 a 1 - Firebase + Voz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <div id="alertContainer"></div><!-- Login View -->
<div id="loginView" class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow">
      <div class="card-body text-center p-5">
        <h2 class="mb-4">Chat App</h2>
        <p class="text-muted mb-4">Ingresa con Google</p>
        <button id="btnLoginGoogle" class="btn btn-danger btn-lg w-100">
          <i class="bi bi-google"></i> Continuar con Google
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Dashboard View -->
<div id="dashboardView" class="d-none">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-chat-dots"></i> Usuarios</h2>
    <div>
      <img id="userAvatar" src="" class="rounded-circle me-2" width="40" height="40">
      <button id="btnLogout" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
    </div>
  </div>
  <ul id="usersList" class="list-group mb-4"></ul>
</div>

<!-- Chat Modal -->
<div class="modal fade" id="chatModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 id="chatModalLabel" class="modal-title mb-0">Chat</h5>
          <small id="typingStatus" class="text-muted"></small>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="chatHistory" class="mb-3" style="max-height: 400px; overflow-y: auto;"></div>
        <form id="chatForm" class="d-flex">
          <input id="chatInput" class="form-control me-2" placeholder="Escribe un mensaje..." autocomplete="off" />
          <button class="btn btn-primary" type="submit">Enviar</button>
        </form>
        <button id="btnCall" class="btn btn-outline-success w-100 mt-3">
          <i class="bi bi-telephone"></i> Llamar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Incoming Call Notification -->
<div class="modal fade" id="incomingCallModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content text-center">
      <div class="modal-header">
        <h5 class="modal-title">Llamada entrante</h5>
      </div>
      <div class="modal-body">
        <p id="incomingCaller">Alguien te está llamando...</p>
        <button id="btnAcceptCall" class="btn btn-success me-2">Aceptar</button>
        <button id="btnRejectCall" class="btn btn-danger">Rechazar</button>
      </div>
    </div>
  </div>
</div>

<!-- Call Modal -->
<div class="modal fade" id="callModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Llamada en curso</h5>
      </div>
      <div class="modal-body text-center">
        <p id="callStatus">Estableciendo conexión...</p>
        <button id="btnEndCall" class="btn btn-danger mt-3">Colgar</button>
      </div>
    </div>
  </div>
</div>

  </div>  <!-- Firebase + App Scripts -->  <script type="module" src="app.js"></script>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
