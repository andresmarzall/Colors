<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Llamadas de Audio - Firebase + WebRTC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div id="alertContainer"></div>

    <!-- Login View -->
    <div id="loginView" class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="card-body text-center p-5">
            <h2 class="mb-4">Llamadas de Audio</h2>
            <p class="text-muted mb-4">Ingresa con Google</p>
            <button id="btnLoginGoogle" class="btn btn-danger btn-lg w-100">
              <i class="bi bi-google"></i> Continuar con Google
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people"></i> Usuarios Disponibles</h2>
        <div>
          <img id="userAvatar" src="" class="rounded-circle me-2" width="40" height="40">
          <button id="btnLogout" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
        </div>
      </div>
      <ul id="usersList" class="list-group mb-4"></ul>
    </div>

    <!-- Call Modal -->
    <div class="modal fade" id="callModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog">
        <div class="modal-content text-center p-4">
          <h5 id="callStatus">En llamada...</h5>
          <p id="callTimer">00:00</p>
          <div class="d-flex justify-content-center gap-3">
            <button id="btnMute" class="btn btn-outline-secondary">
              <i class="bi bi-mic"></i> Silenciar
            </button>
            <button id="btnEndCall" class="btn btn-danger">
              <i class="bi bi-telephone-x"></i> Colgar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Incoming Call Modal -->
    <div class="modal fade" id="incomingCallModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog">
        <div class="modal-content text-center p-4">
          <h5 id="incomingCallLabel"></h5>
          <div class="d-flex justify-content-center gap-2">
            <button id="btnAcceptCall" class="btn btn-success">
              <i class="bi bi-telephone-plus"></i> Aceptar
            </button>
            <button id="btnRejectCall" class="btn btn-danger">
              <i class="bi bi-telephone-x"></i> Rechazar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Audio elements -->
    <audio id="localAudio" autoplay muted></audio>
    <audio id="remoteAudio" autoplay></audio>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, onValue, onDisconnect, remove, update, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
      authDomain: "llamapp-c8d6c.firebaseapp.com",
      databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
      projectId: "llamapp-c8d6c",
      storageBucket: "llamapp-c8d6c.appspot.com",
      messagingSenderId: "132119278171",
      appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
      measurementId: "G-4VN80ZMS5L"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getDatabase();

    // UI Elements
    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const btnLoginGoogle = document.getElementById('btnLoginGoogle');
    const btnLogout = document.getElementById('btnLogout');
    const userAvatar = document.getElementById('userAvatar');
    const usersList = document.getElementById('usersList');
    const alertContainer = document.getElementById('alertContainer');

    const callModal = new bootstrap.Modal(document.getElementById('callModal'));
    const incomingCallModal = new bootstrap.Modal(document.getElementById('incomingCallModal'));
    const callStatus = document.getElementById('callStatus');
    const callTimer = document.getElementById('callTimer');
    const btnEndCall = document.getElementById('btnEndCall');
    const btnMute = document.getElementById('btnMute');
    const btnAcceptCall = document.getElementById('btnAcceptCall');
    const btnRejectCall = document.getElementById('btnRejectCall');
    const incomingCallLabel = document.getElementById('incomingCallLabel');
    const localAudio = document.getElementById('localAudio');
    const remoteAudio = document.getElementById('remoteAudio');

    let currentUser = null;
    let callInterval, peerConnection, localStream, currentCallId;
    let isMuted = false;
    const servers = { 
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" }
      ] 
    };

    // Helper functions
    function showError(msg) {
      const alert = document.createElement('div');
      alert.className = 'alert alert-danger alert-dismissible fade show';
      alert.innerHTML = `${msg}<button class="btn-close" data-bs-dismiss="alert"></button>`;
      alertContainer.appendChild(alert);
      setTimeout(() => alert.remove(), 5000);
    }

    function playRingtone() {
      const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-phone-ring-1938.mp3');
      audio.loop = true;
      return audio;
    }

    let ringtone;

    // Authentication
    btnLoginGoogle.onclick = async () => {
      try { 
        await signInWithPopup(auth, new GoogleAuthProvider()); 
      } catch (e) { 
        showError("Error al iniciar sesión: " + e.message); 
      }
    };

    btnLogout.onclick = async () => {
      stopCall();
      await signOut(auth);
    };

    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user;
        loginView.classList.add('d-none');
        dashboardView.classList.remove('d-none');
        userAvatar.src = user.photoURL;

        // Set user presence
        const userRef = ref(db, 'presence/' + user.uid);
        set(userRef, { 
          name: user.displayName, 
          photo: user.photoURL,
          lastOnline: Date.now()
        });
        
        onDisconnect(userRef).remove();
        loadUsers();
        listenForCalls();
      } else {
        loginView.classList.remove('d-none');
        dashboardView.classList.add('d-none');
      }
    });

    // Users list
    function loadUsers() {
      onValue(ref(db, 'presence'), snap => {
        usersList.innerHTML = '';
        snap.forEach(u => {
          const uid = u.key;
          if (uid === currentUser.uid) return;
          
          const data = u.val();
          const li = document.createElement('li');
          li.className = 'list-group-item d-flex justify-content-between align-items-center';
          li.innerHTML = `
            <div class="d-flex align-items-center">
              <img src="${data.photo}" class="rounded-circle me-3" width="40" height="40">
              <div>
                <h6 class="mb-0">${data.name}</h6>
                <small class="text-muted">${data.lastOnline ? 'En línea' : 'Desconectado'}</small>
              </div>
            </div>
            <button class="btn btn-success" onclick="startCall('${uid}','${data.name}')">
              <i class="bi bi-telephone"></i> Llamar
            </button>`;
          usersList.appendChild(li);
        });
      });
    }

    // Call functions
    window.startCall = async function(targetUid, targetName) {
      try {
        // Get user media
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        localAudio.srcObject = localStream;
        
        // Create peer connection
        peerConnection = new RTCPeerConnection(servers);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        // Setup ICE candidate exchange
        peerConnection.onicecandidate = event => {
          if (event.candidate) {
            const callRef = ref(db, `calls/${currentCallId}/callerCandidates`);
            set(push(callRef), event.candidate.toJSON());
          }
        };
        
        peerConnection.ontrack = event => {
          remoteAudio.srcObject = event.streams[0];
        };

        // Create call in Firebase
        currentCallId = currentUser.uid + '_' + targetUid;
        const callRef = ref(db, 'calls/' + currentCallId);
        
        await set(callRef, { 
          from: currentUser.uid, 
          to: targetUid, 
          status: 'calling', 
          fromName: currentUser.displayName,
          createdAt: Date.now()
        });

        // Listen for answer
        onValue(callRef, async snapshot => {
          const data = snapshot.val();
          if (!data) return;
          
          if (data.status === 'rejected') {
            stopCall();
            showError("La llamada fue rechazada");
          }
          
          if (data.answer && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
          }
        });

        // Listen for callee candidates
        onValue(ref(db, `calls/${currentCallId}/calleeCandidates`), snapshot => {
          snapshot.forEach(candidate => {
            peerConnection.addIceCandidate(new RTCIceCandidate(candidate.val()));
          });
        });

        // Create offer
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await update(callRef, { offer: offer.toJSON() });

        // Update UI
        callStatus.textContent = `Llamando a ${targetName}...`;
        callTimer.textContent = "00:00";
        callModal.show();
        
      } catch (error) {
        console.error("Error starting call:", error);
        showError("Error al iniciar la llamada: " + error.message);
        stopCall();
      }
    };

    function listenForCalls() {
      onValue(ref(db, 'calls'), snapshot => {
        snapshot.forEach(call => {
          const callData = call.val();
          const callId = call.key;
          
          // Check if this call is for current user
          if (callData.to === currentUser.uid && callData.status === 'calling') {
            currentCallId = callId;
            incomingCallLabel.textContent = `${callData.fromName} te está llamando`;
            
            // Play ringtone
            if (ringtone) ringtone.pause();
            ringtone = playRingtone();
            ringtone.play();
            
            incomingCallModal.show();
            
            // Setup accept/reject handlers
            btnAcceptCall.onclick = async () => {
              ringtone.pause();
              await acceptCall(callId, callData.from);
              incomingCallModal.hide();
            };
            
            btnRejectCall.onclick = async () => {
              ringtone.pause();
              await update(ref(db, 'calls/' + callId), { status: 'rejected' });
              setTimeout(() => remove(ref(db, 'calls/' + callId)), 2000);
              incomingCallModal.hide();
            };
          }
        });
      });
    }

    async function acceptCall(callId, callerId) {
      try {
        // Get user media
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        localAudio.srcObject = localStream;
        
        // Create peer connection
        peerConnection = new RTCPeerConnection(servers);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        // Setup ICE candidate exchange
        peerConnection.onicecandidate = event => {
          if (event.candidate) {
            const callRef = ref(db, `calls/${callId}/calleeCandidates`);
            set(push(callRef), event.candidate.toJSON());
          }
        };
        
        peerConnection.ontrack = event => {
          remoteAudio.srcObject = event.streams[0];
        };

        // Update call status
        await update(ref(db, 'calls/' + callId), { status: 'accepted' });
        
        // Listen for offer
        const callRef = ref(db, 'calls/' + callId);
        onValue(callRef, async snapshot => {
          const data = snapshot.val();
          if (!data) return;
          
          if (data.offer && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            
            // Create answer
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            await update(callRef, { answer: answer.toJSON() });
          }
        });

        // Listen for caller candidates
        onValue(ref(db, `calls/${callId}/callerCandidates`), snapshot => {
          snapshot.forEach(candidate => {
            peerConnection.addIceCandidate(new RTCIceCandidate(candidate.val()));
          });
        });

        // Update UI
        callStatus.textContent = `En llamada con ${callerId === currentUser.uid ? 'tú mismo' : callerId}`;
        callTimer.textContent = "00:00";
        callModal.show();
        startCallTimer();
        
      } catch (error) {
        console.error("Error accepting call:", error);
        showError("Error al aceptar la llamada: " + error.message);
        stopCall();
      }
    }

    // Call controls
    btnEndCall.onclick = stopCall;

    btnMute.onclick = () => {
      if (!localStream) return;
      
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(track => {
        track.enabled = !isMuted;
      });
      
      btnMute.innerHTML = isMuted 
        ? '<i class="bi bi-mic-mute"></i> Desilenciar' 
        : '<i class="bi bi-mic"></i> Silenciar';
      
      btnMute.classList.toggle('btn-outline-secondary', !isMuted);
      btnMute.classList.toggle('btn-secondary', isMuted);
    };

    function startCallTimer() {
      let seconds = 0;
      clearInterval(callInterval);
      callInterval = setInterval(() => {
        seconds++;
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = seconds % 60;
        callTimer.textContent = `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
      }, 1000);
    }

    function stopCall() {
      // Stop all media tracks
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      
      // Close peer connection
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      
      // Clear timer
      clearInterval(callInterval);
      
      // Remove call data from Firebase
      if (currentCallId) {
        remove(ref(db, 'calls/' + currentCallId));
        currentCallId = null;
      }
      
      // Stop ringtone if playing
      if (ringtone) {
        ringtone.pause();
        ringtone = null;
      }
      
      // Close modals
      callModal.hide();
      incomingCallModal.hide();
    }

    // Clean up on page unload
    window.addEventListener('beforeunload', stopCall);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
