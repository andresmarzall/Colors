<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llamadas Premium | WebRTC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary: #007AFF;
      --success: #34C759;
      --danger: #FF3B30;
      --dark: #1C1C1E;
      --light: #F2F2F7;
    }
    
    body {
      background-color: var(--light);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }
    
    .card {
      border-radius: 14px;
      border: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    
    .btn-primary {
      background-color: var(--primary);
      border: none;
    }
    
    .btn-success {
      background-color: var(--success);
      border: none;
    }
    
    .btn-danger {
      background-color: var(--danger);
      border: none;
    }
    
    .call-control {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 10px;
      transition: transform 0.2s;
    }
    
    .call-control:active {
      transform: scale(0.95);
    }
    
    .user-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    
    .call-timer {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    
    .call-status {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 5px;
    }
    
    .user-item {
      transition: all 0.2s ease;
    }
    
    .user-item:hover {
      background-color: rgba(0, 122, 255, 0.05);
    }
    
    .modal-content {
      border-radius: 20px;
      overflow: hidden;
    }
    
    .call-modal-header {
      background: linear-gradient(135deg, #007AFF, #34C759);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .call-modal-body {
      padding: 30px 20px;
      text-align: center;
    }
    
    .call-buttons {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
    
    .status-badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <!-- Login View -->
    <div id="loginView" class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="card-body text-center p-5">
            <div class="mb-4">
              <i class="bi bi-telephone-plus" style="font-size: 3rem; color: var(--primary);"></i>
            </div>
            <h2 class="mb-4">Llamadas Premium</h2>
            <p class="text-muted mb-4">Conéctate con tus contactos</p>
            <button id="btnLoginGoogle" class="btn btn-danger btn-lg w-100">
              <i class="bi bi-google me-2"></i> Continuar con Google
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-people-fill me-2"></i> Contactos Disponibles</h2>
        <div class="d-flex align-items-center">
          <img id="userAvatar" src="" class="rounded-circle me-2" width="40" height="40">
          <button id="btnLogout" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </div>
      
      <div class="card shadow">
        <div class="card-body p-0">
          <ul id="usersList" class="list-group list-group-flush"></ul>
        </div>
      </div>
    </div>

    <!-- Call Modals -->
    <div class="modal fade" id="callModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="call-modal-header">
            <h5 id="callTitle">Llamada</h5>
          </div>
          <div class="call-modal-body">
            <img id="callAvatar" src="" class="user-avatar mb-4">
            <h4 id="callName" class="call-status">Llamando...</h4>
            <p id="callTimer" class="call-timer">00:00</p>
            <div id="callButtons" class="call-buttons">
              <!-- Buttons will be dynamically inserted here -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase & WebRTC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, onValue, onDisconnect, remove, update, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
      authDomain: "llamapp-c8d6c.firebaseapp.com",
      databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
      projectId: "llamapp-c8d6c",
      storageBucket: "llamapp-c8d6c.appspot.com",
      messagingSenderId: "132119278171",
      appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
      measurementId: "G-4VN80ZMS5L"
    };
    
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getDatabase();

    // UI Elements
    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const btnLoginGoogle = document.getElementById('btnLoginGoogle');
    const btnLogout = document.getElementById('btnLogout');
    const userAvatar = document.getElementById('userAvatar');
    const usersList = document.getElementById('usersList');
    const callModal = new bootstrap.Modal(document.getElementById('callModal'));
    const callTitle = document.getElementById('callTitle');
    const callName = document.getElementById('callName');
    const callAvatar = document.getElementById('callAvatar');
    const callTimer = document.getElementById('callTimer');
    const callButtons = document.getElementById('callButtons');

    // App State
    let currentUser = null;
    let callInterval, peerConnection, localStream, currentCallId;
    let isMuted = false;
    let callPartner = null;
    let callType = null; // 'outgoing' or 'incoming'
    
    // ICE Servers Configuration
    const iceServers = {
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    };

    // Helper Functions
    function showAlert(message, type = 'danger') {
      const alert = document.createElement('div');
      alert.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 end-0 m-3`;
      alert.innerHTML = `
        <div>${message}</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      `;
      document.body.appendChild(alert);
      
      setTimeout(() => {
        alert.classList.remove('show');
        setTimeout(() => alert.remove(), 300);
      }, 3000);
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
    }

    function startCallTimer() {
      let seconds = 0;
      clearInterval(callInterval);
      callInterval = setInterval(() => {
        seconds++;
        callTimer.textContent = formatTime(seconds);
      }, 1000);
    }

    // Authentication
    btnLoginGoogle.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (error) {
        showAlert(`Error al iniciar sesión: ${error.message}`);
      }
    });

    btnLogout.addEventListener('click', async () => {
      try {
        await endCall();
        await signOut(auth);
      } catch (error) {
        showAlert(`Error al cerrar sesión: ${error.message}`);
      }
    });

    // User Presence
    function setupUserPresence(user) {
      const userRef = ref(db, `presence/${user.uid}`);
      
      // Set user presence
      set(userRef, {
        uid: user.uid,
        name: user.displayName,
        photo: user.photoURL,
        status: 'online'
      });
      
      // Clean up on disconnect
      onDisconnect(userRef).remove();
    }

    // Load Users List
    function loadUsers() {
      const usersRef = ref(db, 'presence');
      
      onValue(usersRef, (snapshot) => {
        usersList.innerHTML = '';
        
        snapshot.forEach((userSnapshot) => {
          const user = userSnapshot.val();
          if (user.uid === currentUser.uid) return;
          
          const userItem = document.createElement('li');
          userItem.className = 'list-group-item user-item';
          userItem.innerHTML = `
            <div class="d-flex justify-content-between align-items-center">
              <div class="d-flex align-items-center">
                <img src="${user.photo}" class="rounded-circle me-3" width="40" height="40">
                <div>
                  <h6 class="mb-0">${user.name}</h6>
                  <small class="text-muted">
                    <span class="badge ${user.status === 'online' ? 'bg-success' : 'bg-secondary'} status-badge">
                      ${user.status === 'online' ? 'En línea' : 'Desconectado'}
                    </span>
                  </small>
                </div>
              </div>
              <button class="btn btn-primary btn-sm" onclick="startCall('${user.uid}', '${user.name}', '${user.photo}')">
                <i class="bi bi-telephone"></i> Llamar
              </button>
            </div>
          `;
          
          usersList.appendChild(userItem);
        });
      });
    }

    // Start Call
    window.startCall = async function(targetUid, targetName, targetPhoto) {
      try {
        callPartner = { uid: targetUid, name: targetName, photo: targetPhoto };
        callType = 'outgoing';
        currentCallId = `${currentUser.uid}_${targetUid}_${Date.now()}`;
        
        // Update UI
        callTitle.textContent = 'Llamando...';
        callName.textContent = `A ${targetName}`;
        callAvatar.src = targetPhoto;
        callTimer.textContent = '00:00';
        
        // Create call buttons
        callButtons.innerHTML = `
          <button id="btnCancelCall" class="btn btn-danger call-control">
            <i class="bi bi-telephone-x-fill" style="font-size: 1.5rem;"></i>
          </button>
        `;
        
        document.getElementById('btnCancelCall').addEventListener('click', endCall);
        callModal.show();
        
        // Setup WebRTC
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        peerConnection = new RTCPeerConnection(iceServers);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        // ICE Candidate Handling
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            const candidatesRef = ref(db, `calls/${currentCallId}/callerCandidates`);
            push(candidatesRef, event.candidate.toJSON());
          }
        };
        
        // Create call in Firebase
        const callRef = ref(db, `calls/${currentCallId}`);
        await set(callRef, {
          callId: currentCallId,
          callerId: currentUser.uid,
          callerName: currentUser.displayName,
          callerPhoto: currentUser.photoURL,
          calleeId: targetUid,
          status: 'calling',
          createdAt: Date.now()
        });
        
        // Listen for call answer
        onValue(callRef, async (snapshot) => {
          const callData = snapshot.val();
          if (!callData) return;
          
          if (callData.status === 'accepted') {
            // Update UI for active call
            callTitle.textContent = 'En llamada';
            callName.textContent = `Con ${targetName}`;
            startCallTimer();
            
            // Create call buttons
            callButtons.innerHTML = `
              <button id="btnToggleMute" class="btn btn-outline-secondary call-control me-3">
                <i id="muteIcon" class="bi bi-mic-fill" style="font-size: 1.5rem;"></i>
              </button>
              <button id="btnEndCall" class="btn btn-danger call-control">
                <i class="bi bi-telephone-x-fill" style="font-size: 1.5rem;"></i>
              </button>
            `;
            
            document.getElementById('btnToggleMute').addEventListener('click', toggleMute);
            document.getElementById('btnEndCall').addEventListener('click', endCall);
            
          } else if (callData.status === 'rejected') {
            showAlert(`${targetName} rechazó la llamada`, 'warning');
            endCall();
          } else if (callData.status === 'ended') {
            endCall();
          }
        });
        
        // Listen for answer
        onValue(ref(db, `calls/${currentCallId}/answer`), async (snapshot) => {
          const answer = snapshot.val();
          if (answer && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
          }
        });
        
        // Create offer
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await update(callRef, { offer: offer });
        
      } catch (error) {
        console.error('Error starting call:', error);
        showAlert(`Error al iniciar la llamada: ${error.message}`);
        endCall();
      }
    }

    // Listen for incoming calls
    function listenForIncomingCalls() {
      const callsRef = ref(db, 'calls');
      
      onValue(callsRef, (snapshot) => {
        snapshot.forEach((callSnapshot) => {
          const callData = callSnapshot.val();
          
          // Check if this is an incoming call for current user
          if (callData.calleeId === currentUser.uid && callData.status === 'calling') {
            currentCallId = callData.callId;
            callPartner = {
              uid: callData.callerId,
              name: callData.callerName,
              photo: callData.callerPhoto
            };
            callType = 'incoming';
            
            // Update UI
            callTitle.textContent = 'Llamada entrante';
            callName.textContent = `${callData.callerName} te llama`;
            callAvatar.src = callData.callerPhoto;
            callTimer.textContent = '';
            
            // Create call buttons
            callButtons.innerHTML = `
              <button id="btnAcceptCall" class="btn btn-success call-control me-3">
                <i class="bi bi-telephone-plus-fill" style="font-size: 1.5rem;"></i>
              </button>
              <button id="btnRejectCall" class="btn btn-danger call-control">
                <i class="bi bi-telephone-x-fill" style="font-size: 1.5rem;"></i>
              </button>
            `;
            
            document.getElementById('btnAcceptCall').addEventListener('click', acceptCall);
            document.getElementById('btnRejectCall').addEventListener('click', rejectCall);
            
            callModal.show();
          }
        });
      });
    }

    // Accept Call
    async function acceptCall() {
      try {
        const callRef = ref(db, `calls/${currentCallId}`);
        
        // Update call status
        await update(callRef, { status: 'accepted' });
        
        // Get user media
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Create peer connection
        peerConnection = new RTCPeerConnection(iceServers);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        // ICE Candidate Handling
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            const candidatesRef = ref(db, `calls/${currentCallId}/calleeCandidates`);
            push(candidatesRef, event.candidate.toJSON());
          }
        };
        
        // Listen for offer
        onValue(ref(db, `calls/${currentCallId}/offer`), async (snapshot) => {
          const offer = snapshot.val();
          if (offer && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            
            // Create answer
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            await update(callRef, { answer: answer });
          }
        });
        
        // Update UI for active call
        callTitle.textContent = 'En llamada';
        callName.textContent = `Con ${callPartner.name}`;
        startCallTimer();
        
        // Create call buttons
        callButtons.innerHTML = `
          <button id="btnToggleMute" class="btn btn-outline-secondary call-control me-3">
            <i id="muteIcon" class="bi bi-mic-fill" style="font-size: 1.5rem;"></i>
          </button>
          <button id="btnEndCall" class="btn btn-danger call-control">
            <i class="bi bi-telephone-x-fill" style="font-size: 1.5rem;"></i>
          </button>
        `;
        
        document.getElementById('btnToggleMute').addEventListener('click', toggleMute);
        document.getElementById('btnEndCall').addEventListener('click', endCall);
        
      } catch (error) {
        console.error('Error answering call:', error);
        showAlert(`Error al aceptar la llamada: ${error.message}`);
        endCall();
      }
    }

    // Reject Call
    async function rejectCall() {
      const callRef = ref(db, `calls/${currentCallId}`);
      await update(callRef, { status: 'rejected' });
      endCall();
    }

    // End Call
    async function endCall() {
      try {
        // Stop all media tracks
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
          localStream = null;
        }
        
        // Close peer connection
        if (peerConnection) {
          peerConnection.close();
          peerConnection = null;
        }
        
        // Clear timer
        clearInterval(callInterval);
        
        // Update call status in Firebase
        if (currentCallId) {
          const callRef = ref(db, `calls/${currentCallId}`);
          await update(callRef, { status: 'ended', endedAt: Date.now() });
          
          // Remove call data after delay
          setTimeout(() => {
            remove(callRef);
            remove(ref(db, `calls/${currentCallId}/callerCandidates`));
            remove(ref(db, `calls/${currentCallId}/calleeCandidates`));
          }, 2000);
        }
        
        // Close modal
        callModal.hide();
        
        // Reset state
        currentCallId = null;
        callPartner = null;
        callType = null;
        
      } catch (error) {
        console.error('Error ending call:', error);
        showAlert(`Error al finalizar la llamada: ${error.message}`);
      }
    }

    // Toggle Mute
    function toggleMute() {
      if (!localStream) return;
      
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(track => {
        track.enabled = !isMuted;
      });
      
     const muteIcon = document.getElementById('muteIcon');
      muteIcon.className = isMuted ? 'bi bi-mic-mute-fill' : 'bi bi-mic-fill';
    }

    // Auth State Observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loginView.classList.add('d-none');
        dashboardView.classList.remove('d-none');
        userAvatar.src = user.photoURL;
        
        setupUserPresence(user);
        loadUsers();
        listenForIncomingCalls();
      } else {
        currentUser = null;
        loginView.classList.remove('d-none');
        dashboardView.classList.add('d-none');
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
