<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .task-card { transition: all 0.3s; }
        .task-card:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .completed { text-decoration: line-through; opacity: 0.7; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <!-- Login View -->
        <div id="loginView" class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <h2 class="mb-4">Task Manager</h2>
                        <p class="text-muted mb-4">Administra tus tareas fácilmente</p>
                        <button id="btnLoginGoogle" class="btn btn-danger btn-lg w-100">
                            <i class="bi bi-google"></i> Continuar con Google
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboardView" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>
                    <i class="bi bi-list-check"></i> Mis Tareas
                </h2>
                <div class="d-flex align-items-center">
                    <img id="currentUserAvatar" src="" class="user-avatar me-2">
                    <button id="btnLogout" class="btn btn-outline-danger btn-sm">
                        Cerrar sesión
                    </button>
                </div>
            </div>

            <!-- Add Task Form -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <form id="taskForm">
                        <div class="input-group">
                            <input type="text" id="taskInput" class="form-control" placeholder="Nueva tarea..." required>
                            <button class="btn btn-primary" type="submit">
                                <i class="bi bi-plus-lg"></i> Agregar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tasks List -->
            <div id="tasksContainer">
                <div class="card shadow-sm mb-3">
                    <div class="card-body text-center py-5 text-muted">
                        <i class="bi bi-list-check fs-1"></i>
                        <p class="mt-3">No hay tareas aún</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
            authDomain: "llamapp-c8d6c.firebaseapp.com",
            databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
            projectId: "llamapp-c8d6c",
            storageBucket: "llamapp-c8d6c.appspot.com",
            messagingSenderId: "132119278171",
            appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e",
            measurementId: "G-4VN80ZMS5L"
        };

        // Initialize Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getDatabase, 
            ref, 
            push, 
            onValue, 
            update,
            remove
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // DOM Elements
        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const btnLoginGoogle = document.getElementById('btnLoginGoogle');
        const btnLogout = document.getElementById('btnLogout');
        const currentUserAvatar = document.getElementById('currentUserAvatar');
        const taskForm = document.getElementById('taskForm');
        const taskInput = document.getElementById('taskInput');
        const tasksContainer = document.getElementById('tasksContainer');

        // Auth Functions
        btnLoginGoogle.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert('Error al iniciar sesión: ' + error.message);
            }
        });

        btnLogout.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                alert('Error al cerrar sesión: ' + error.message);
            }
        });

        // Task Functions
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const taskText = taskInput.value.trim();
            
            if (taskText && auth.currentUser) {
                try {
                    await push(ref(db, `users/${auth.currentUser.uid}/tasks`), {
                        text: taskText,
                        completed: false,
                        createdAt: Date.now()
                    });
                    taskInput.value = '';
                } catch (error) {
                    alert('Error al agregar tarea: ' + error.message);
                }
            }
        });

        function renderTasks(tasks) {
            if (!tasks || Object.keys(tasks).length === 0) {
                tasksContainer.innerHTML = `
                    <div class="card shadow-sm mb-3">
                        <div class="card-body text-center py-5 text-muted">
                            <i class="bi bi-list-check fs-1"></i>
                            <p class="mt-3">No hay tareas aún</p>
                        </div>
                    </div>
                `;
                return;
            }

            tasksContainer.innerHTML = '';
            Object.entries(tasks).forEach(([taskId, task]) => {
                const taskElement = document.createElement('div');
                taskElement.className = `card shadow-sm mb-3 task-card ${task.completed ? 'completed' : ''}`;
                taskElement.innerHTML = `
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <input type="checkbox" class="form-check-input me-2" ${task.completed ? 'checked' : ''} 
                                    data-task-id="${taskId}">
                                <span class="task-text">${task.text}</span>
                            </div>
                            <button class="btn btn-sm btn-outline-danger delete-task" data-task-id="${taskId}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                        <small class="text-muted d-block mt-2">
                            Creada: ${new Date(task.createdAt).toLocaleString()}
                        </small>
                    </div>
                `;
                tasksContainer.appendChild(taskElement);
            });

            // Add event listeners to checkboxes
            document.querySelectorAll('.form-check-input').forEach(checkbox => {
                checkbox.addEventListener('change', async (e) => {
                    const taskId = e.target.dataset.taskId;
                    try {
                        await update(ref(db, `users/${auth.currentUser.uid}/tasks/${taskId}`), {
                            completed: e.target.checked
                        });
                    } catch (error) {
                        alert('Error al actualizar tarea: ' + error.message);
                    }
                });
            });

            // Add event listeners to delete buttons
            document.querySelectorAll('.delete-task').forEach(button => {
                button.addEventListener('click', async (e) => {
                    const taskId = e.target.closest('button').dataset.taskId;
                    if (confirm('¿Eliminar esta tarea?')) {
                        try {
                            await remove(ref(db, `users/${auth.currentUser.uid}/tasks/${taskId}`));
                        } catch (error) {
                            alert('Error al eliminar tarea: ' + error.message);
                        }
                    }
                });
            });
        }

        // Auth State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                loginView.classList.add('d-none');
                dashboardView.classList.remove('d-none');
                currentUserAvatar.src = user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.displayName || user.email);

                // Load tasks
                const tasksRef = ref(db, `users/${user.uid}/tasks`);
                onValue(tasksRef, (snapshot) => {
                    renderTasks(snapshot.val());
                });
            } else {
                // User is signed out
                loginView.classList.remove('d-none');
                dashboardView.classList.add('d-none');
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
