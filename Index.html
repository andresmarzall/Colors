<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>App de Llamadas 1 a 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div id="loginView" class="text-center">
      <h2>App de Llamadas</h2>
      <button id="btnLogin" class="btn btn-danger mt-3">
        <i class="bi bi-google"></i> Iniciar sesión con Google
      </button>
    </div>

    <div id="appView" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Usuarios conectados</h4>
        <button id="btnLogout" class="btn btn-outline-danger btn-sm">Salir</button>
      </div>
      <ul id="usersList" class="list-group mb-4"></ul>
      <button id="btnHangup" class="btn btn-danger d-none"><i class="bi bi-telephone-x-fill"></i> Colgar</button>
    </div>
  </div>

  <!-- Modal llamada entrante -->
  <div class="modal fade" id="incomingCallModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content p-3">
        <h5>¡Llamada entrante!</h5>
        <p id="callerId" class="text-muted"></p>
        <button id="btnAcceptCall" class="btn btn-success me-2">Aceptar</button>
        <button id="btnRejectCall" class="btn btn-danger">Rechazar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBZQdrEmpHpoRk1Bwpa6TsjAJt2K246A8",
      authDomain: "llamapp-c8d6c.firebaseapp.com",
      databaseURL: "https://llamapp-c8d6c-default-rtdb.firebaseio.com",
      projectId: "llamapp-c8d6c",
      storageBucket: "llamapp-c8d6c.appspot.com",
      messagingSenderId: "132119278171",
      appId: "1:132119278171:web:d11d942c8dc2f4ed9a057e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getDatabase();
    const provider = new GoogleAuthProvider();

    // DOM
    const btnLogin = document.getElementById("btnLogin");
    const btnLogout = document.getElementById("btnLogout");
    const loginView = document.getElementById("loginView");
    const appView = document.getElementById("appView");
    const usersList = document.getElementById("usersList");
    const btnHangup = document.getElementById("btnHangup");

    const incomingModal = new bootstrap.Modal(document.getElementById('incomingCallModal'));
    const btnAcceptCall = document.getElementById("btnAcceptCall");
    const btnRejectCall = document.getElementById("btnRejectCall");
    const callerIdText = document.getElementById("callerId");

    let localStream, peer, currentUser;

    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // Login
    btnLogin.onclick = async () => {
      await signInWithPopup(auth, provider);
    };

    // Logout
    btnLogout.onclick = async () => {
      if (currentUser) {
        await remove(ref(db, `users/${currentUser.uid}`));
      }
      await signOut(auth);
    };

    // Estado de sesión
    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user;
        loginView.classList.add("d-none");
        appView.classList.remove("d-none");
        set(ref(db, `users/${user.uid}`), {
          name: user.displayName,
          uid: user.uid
        });
        listenUsers();
        listenForCalls();
      } else {
        loginView.classList.remove("d-none");
        appView.classList.add("d-none");
      }
    });

    // Lista de usuarios
    function listenUsers() {
      onValue(ref(db, 'users'), snap => {
        usersList.innerHTML = '';
        snap.forEach(child => {
          const user = child.val();
          if (user.uid === currentUser.uid) return;
          const li = document.createElement('li');
          li.className = 'list-group-item d-flex justify-content-between align-items-center';
          li.textContent = user.name;
          const btnCall = document.createElement('button');
          btnCall.className = 'btn btn-success btn-sm';
          btnCall.innerHTML = '<i class="bi bi-telephone-fill"></i>';
          btnCall.onclick = () => startCall(user.uid);
          li.appendChild(btnCall);
          usersList.appendChild(li);
        });
      });
    }

    // Iniciar llamada
    async function startCall(toUID) {
      peer = new RTCPeerConnection(servers);
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      localStream.getTracks().forEach(track => peer.addTrack(track, localStream));

      peer.onicecandidate = e => {
        if (e.candidate) {
          push(ref(db, `calls/${toUID}/candidates`), e.candidate.toJSON());
        }
      };

      peer.ontrack = e => {
        const audio = new Audio();
        audio.srcObject = e.streams[0];
        audio.autoplay = true;
      };

      const offer = await peer.createOffer();
      await peer.setLocalDescription(offer);
      set(ref(db, `calls/${toUID}/offer`), {
        from: currentUser.uid,
        offer
      });

      btnHangup.classList.remove("d-none");
    }

    // Recibir llamada
    function listenForCalls() {
      onValue(ref(db, `calls/${currentUser.uid}/offer`), async snap => {
        if (!snap.exists()) return;
        const data = snap.val();
        callerIdText.textContent = `De: ${data.from}`;
        incomingModal.show();

        btnAcceptCall.onclick = async () => {
          incomingModal.hide();
          peer = new RTCPeerConnection(servers);
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          localStream.getTracks().forEach(track => peer.addTrack(track, localStream));

          peer.onicecandidate = e => {
            if (e.candidate) {
              push(ref(db, `calls/${data.from}/candidates`), e.candidate.toJSON());
            }
          };

          peer.ontrack = e => {
            const audio = new Audio();
            audio.srcObject = e.streams[0];
            audio.autoplay = true;
          };

          await peer.setRemoteDescription(data.offer);
          const answer = await peer.createAnswer();
          await peer.setLocalDescription(answer);
          set(ref(db, `calls/${data.from}/answer`), answer);
          btnHangup.classList.remove("d-none");
        };

        btnRejectCall.onclick = () => {
          remove(ref(db, `calls/${currentUser.uid}`));
          incomingModal.hide();
        };
      });

      // Escuchar respuesta
      onValue(ref(db, `calls/${currentUser.uid}/answer`), async snap => {
        if (snap.exists() && peer) {
          const answer = snap.val();
          await peer.setRemoteDescription(answer);
        }
      });

      // ICE candidates
      onValue(ref(db, `calls/${currentUser.uid}/candidates`), snap => {
        snap.forEach(child => {
          const candidate = new RTCIceCandidate(child.val());
          peer.addIceCandidate(candidate);
        });
      });
    }

    // Finalizar llamada
    btnHangup.onclick = () => {
      if (peer) peer.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      peer = null;
      localStream = null;
      remove(ref(db, `calls/${currentUser.uid}`));
      btnHangup.classList.add("d-none");
    };
  </script>
</body>
</html>
